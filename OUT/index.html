--vb-color-enemy-soft); }\n.vb-frame--slim.vb-frame--power  { --vb-fill: var(--vb-color-power-soft); }\n/* Chipped: the existing look, reserved for things you act on or that are selected. */\n.vb-frame--chipped { --vb-cut: var(--vb-cut-md); --vb-bw: 1; --vb-edge: var(--vb-color-line); }\n/* High contrast: a container with no edge must still separate from the world at 3:1. */\n.vb-contrast .vb-frame--slim { --vb-bw: 1; --vb-edge: var(--vb-color-line-strong); }", "slimMigration": "/* Arcade.uss / Gui.uss — move today's containers to the slim kind (same selectors, no markup change). */\n.vb-section, .vb-dialog, .vb-details, .vb-score, .vb-perk-row, .vb-rule, .vb-result,\n.vb-queue__row, .vb-merchant__exchange, .menu__checkpoint, .pause__perks, .results__score,\n.settings__note, .menu__best, .pause__chip {\n    --vb-cut: 4; --vb-bw: 0;\n}\n.vb-contrast .vb-section, .vb-contrast .vb-dialog, .vb-contrast .vb-details, .vb-contrast .vb-score,\n.vb-contrast .vb-perk-row, .vb-contrast .vb-rule, .vb-contrast .vb-result {\n    --vb-bw: 1; --vb-edge: var(--vb-color-line-strong);\n}", "package": {"name": "com.veilbreak.gui", "version": "0.2.0", "displayName": "Veilbreak GUI", "unity": "6000.3", "description": "Portable UI Toolkit kit and source of the Veilbreak design system (Veil theme): generated tokens, fonts and icons, cut-corner shapes painted from USS, themed buttons and form controls, Power/focus/health meters, skill buttons, operative and perk cards, hover/tap popovers, a translucent portrait battle HUD, camera gestures and a portrait screen layer (navigator, safe area, dialogs). Data-agnostic: bind plain view models from any game.", "dependencies": {"com.unity.modules.uielements": "1.0.0", "com.unity.modules.vectorgraphics": "1.0.0"}, "keywords": ["ui-toolkit", "hud", "veilbreak", "theme", "mobile"], "author": {"name": "tuomashatakka", "url": "https://tuomashatakka.github.io", "email": "tuomas.hatakka@gmail.com"}, "samples": [{"displayName": "Gallery", "description": "Every component in its main states, bound to sample view models.", "path": "Samples~/Gallery"}, {"displayName": "BattleHud", "description": "A portrait battle board with fake data: HUD band, manual queue, operative cards and the world layer.", "path": "Samples~/BattleHud"}]}, "integration": "<p>How to put the kit on screen in a game, from an empty scene to a running battle board. The <code>BattleHud<\/code> sample is this guide in code. The arcade (<code>unity/Assets/_Arcade/Runtime/ArcadeUI.cs<\/code>, <code>WorldReadouts.cs<\/code>) is the full client.<\/p>\n<h4>1. Install<\/h4>\n<p>Reference the folder as a local package, for example in <code>Packages/manifest.json<\/code>:<\/p>\n<pre class=\"code\"><code>&quot;com.veilbreak.gui&quot;: &quot;file:../../packages/com.veilbreak.gui&quot;<\/code><\/pre>\n<p>It needs Unity 6000.3 or newer and the built-in UI Elements and Vector Graphics modules. It has no other package dependencies, uses no <code>Resources.Load<\/code> or scene objects, and never reads game types.<\/p>\n<h4>2. Panel settings and theme<\/h4>\n<p>Use <code>Runtime/Settings/VeilbreakPortrait.asset<\/code> as the <code>UIDocument<\/code>'s Panel Settings: Scale With Screen Size, 390 × 844, match width, theme <code>VeilbreakGui.tss<\/code>. To keep your own asset (and its GUID), copy the template's values into it from an editor script, then set your theme:<\/p>\n<pre class=\"code\"><code>var template = AssetDatabase.LoadAssetAtPath&lt;PanelSettings&gt;(&quot;Packages/com.veilbreak.gui/Runtime/Settings/VeilbreakPortrait.asset&quot;);\nEditorUtility.CopySerialized(template, panel); panel.name = &quot;Panel&quot;; panel.themeStyleSheet = myTheme;<\/code><\/pre>\n<p>Your theme imports the kit first, then your sheets:<\/p>\n<pre class=\"code\"><code>@import url(&quot;/Packages/com.veilbreak.gui/Runtime/Styles/VeilbreakGui.tss&quot;);\n@import url(&quot;MyGame.uss&quot;);<\/code><\/pre>\n<ul><li><code>VeilbreakGui.tss<\/code> imports the Unity default theme, then <code>Tokens.uss<\/code>, <code>Gui.uss<\/code>, <code>Layout.uss<\/code>, <code>World.uss<\/code> and <code>Icons.uss<\/code>.<\/li><li><code>VeilbreakGuiContrast.tss<\/code> is the same with the contrast colours on <code>:root<\/code>, for an always-high-contrast build. For a runtime toggle, use the <code>vb-contrast<\/code> root class instead.<\/li><li>Keep the kit in the <strong>theme<\/strong>. Popovers are placed on the panel root, where sheets attached to a UXML element never reach.<\/li><li>Sheets on a UXML <code>&lt;Style&gt;<\/code> apply after the theme, so on equal specificity your game rules win over the kit's.<\/li><\/ul>\n<h4>3. The tree<\/h4>\n<p>A portrait board is a column. Put the world layer first, so it draws under every panel, and the screen layer last:<\/p>\n<pre class=\"code\"><code>&lt;ui:UXML xmlns:ui=&quot;UnityEngine.UIElements&quot;&gt;\n  &lt;ui:VisualElement name=&quot;root&quot; class=&quot;vb-root&quot;&gt;\n    &lt;ui:VisualElement name=&quot;hud&quot;/&gt;\n    &lt;ui:VisualElement name=&quot;battlefield&quot; class=&quot;vb-grow&quot;/&gt;\n    &lt;ui:VisualElement name=&quot;cards&quot; class=&quot;vb-row vb-row--between&quot;/&gt;\n    &lt;ui:VisualElement name=&quot;screen&quot; class=&quot;vb-screen&quot; style=&quot;display: none;&quot;/&gt;\n  &lt;/ui:VisualElement&gt;\n&lt;/ui:UXML&gt;<\/code><\/pre>\n<h4>4. Safe area, navigation and Back<\/h4>\n<pre class=\"code\"><code>var safe = new SafeAreaRoot(root, document.panelSettings, screen);   // pads root, insets the screen layer\nvar nav = new Navigator(screen) {\n    Blocked  = () =&gt; introPlaying,                                  // Back does nothing meanwhile\n    Fallback = () =&gt; { if (inRun) Pause(); else ConfirmExit(); },   // nothing else handled Back\n};\nnav.Opening += _ =&gt; { CancelDrags(); Cover(true); };                // a page covers the board\nnav.Closed  += () =&gt; Cover(false);\n\nvoid Update() {\n    safe.Refresh();                                                 // cheap; re-applies only on change\n    safe.Flags(settings.largerText, settings.reducedMotion, settings.highContrast, settings.reducedFlashes);\n    if (escapePressed) nav.Back();                                  // Android back, Escape, gamepad B\n}<\/code><\/pre>\n<p>Use <code>vb-covered<\/code> on the HUD, cards and world layer for <code>Cover<\/code>. A page:<\/p>\n<pre class=\"code\"><code>VisualElement Settings() {\n    var page = nav.Open(&quot;settings&quot;, back: MainMenu);                // vb-page--settings on vb-screen--settings\n    new ScreenHeader(&quot;SETTINGS&quot;, &quot;SAVED&quot;).Into(page).Back += () =&gt; nav.Back();\n    page.AddToClassList(&quot;vb-page--headed&quot;);\n    var body = Ui.Scroll(page, &quot;vb-page__scroll&quot;).contentContainer;\n    var audio = Ui.Section(body, &quot;AUDIO&quot;);\n    new VbSlider(&quot;Music&quot;, settings.music).Into(audio).Changed(v =&gt; settings.music = v);\n    new VbSwitch(&quot;REDUCED MOTION&quot;, &quot;No camera shake&quot;, settings.reducedMotion).Into(audio).Changed(v =&gt; settings.reducedMotion = v);\n    return page;\n}<\/code><\/pre>\n<p>A confirmation:<\/p>\n<pre class=\"code\"><code>var sheet = Dialog.Push(nav, &quot;LEAVE GAME?&quot;, &quot;Your profile is saved.&quot;);\nnew VbButton(&quot;EXIT GAME&quot;, ButtonVariant.Danger, null, &quot;back&quot;, Application.Quit).Into(sheet);\nnew VbButton(&quot;CANCEL&quot;, ButtonVariant.Secondary, null, &quot;close&quot;, () =&gt; nav.Back()).Into(sheet);<\/code><\/pre>\n<p>Behind every page a <code>Backdrop<\/code> can carry the menu art: <code>root.Insert(0, new Backdrop(menuArt))<\/code>.<\/p>\n<h4>5. Binding<\/h4>\n<p>Map your state to the view models (<code>HudView<\/code>, <code>OperativeView<\/code>, <code>SkillView<\/code>, <code>QueueView<\/code>, <code>PerkView<\/code>, <code>BossView<\/code>, <code>ScoreView<\/code>, <code>ContributionView<\/code>, <code>RuleView<\/code>) and call <code>Bind<\/code> every frame. Components reuse their children. The kit never reads your types.<\/p>\n<pre class=\"code\"><code>hud.Bind(hudView);\nfor (int i = 0; i &lt; 4; i++) cards[i].Bind(operativeViews[i]);\nstrip.Set(power, 100, &quot;+12/s&quot;, hint, previewFrom, previewTo).Reserve(25).Queue(queue, q =&gt; game.CancelQueued(q.actor, q.slot));<\/code><\/pre>\n<p>Formatting helpers keep numbers consistent: <code>Ui.Number<\/code>, <code>Ui.Compact<\/code> and <code>Ui.Seconds<\/code>. Colours for rich text come from <code>VbTokens<\/code> (<code>VbTokens.Hex(VbTokens.Text3)<\/code>).<\/p>\n<h4>6. Input: aim drags and camera gestures<\/h4>\n<p>The kit draws; the game decides. Attach a <code>TargetDrag<\/code> to each skill button or to the battlefield, then a <code>GestureSurface<\/code> after it on the same element:<\/p>\n<pre class=\"code\"><code>card.Skill(0).AddManipulator(new TargetDrag(\n    begin: (p, id) =&gt; game.CanAim(op, 0),  move: p =&gt; Aim(p),  end: p =&gt; Release(p),  cancel: CancelAim));\nvar gestures = new GestureSurface(busy: () =&gt; aiming);\nbattlefield.AddManipulator(gestures);                               // after the targeting drag\ngestures.Panned  += (a, b) =&gt; rig.PanBy(ToMetres(b - a));\ngestures.Pinched += f =&gt; rig.ZoomBy(f);\ngestures.Twisted += d =&gt; rig.RotateBy(d, 0);\ngestures.DoubleTapped += _ =&gt; rig.ResetView();\ngestures.Hovered += p =&gt; rig.PointAt(p.HasValue ? ToViewport(p.Value) : null);<\/code><\/pre>\n<p>A drag always wins. A pointer the targeting drag captured never becomes a gesture, and while <code>busy<\/code> is true the surface ignores everything. Call <code>gestures.Cancel()<\/code> when a page opens.<\/p>\n<h4>7. The world layer<\/h4>\n<pre class=\"code\"><code>layer = new WorldLayer { Project = Project };\nroot.Insert(0, layer);                                              // under every panel\nVector2? Project(Vector3 p) {\n    var v = camera.WorldToViewportPoint(p); if (v.z &lt;= 0 || layer.panel == null) return null;\n    var size = layer.panel.visualTree.worldBound.size;\n    return layer.WorldToLocal(new Vector2(v.x * size.x, (1 - v.y) * size.y));\n}\nvoid LateUpdate() {\n    layer.style.top = battlefield.worldBound.yMin - root.worldBound.yMin;     // fit the battlefield band\n    layer.style.bottom = root.worldBound.yMax - battlefield.worldBound.yMax;\n    layer.ReducedMotion = settings.reducedMotion;\n    layer.BeginFrame();\n    foreach (var a in actors) if (a.alive) layer.Bar(a.id, a.head, a.hp / a.maxHp, a.barrier / a.maxHp, a.team, a.rank);\n    layer.EndFrame(simulationDelta);                                // simulation time, not Time.deltaTime\n}\nvoid OnConfirmedHit(Hit h) =&gt; layer.Text(h.target, h.point, h.amount, h.toAlly ? CombatTextKind.Taken : CombatTextKind.Damage);<\/code><\/pre>\n<p>Call <code>Text<\/code> only from confirmed simulation events. Presentation never applies damage, and the layer does not decide what happened.<\/p>\n<h4>8. Accessibility checklist<\/h4>\n<ul><li>Pass every setting to <code>SafeAreaRoot.Flags<\/code>, and <code>ReducedMotion<\/code> to the world layer.<\/li><li>Give every control a word: <code>Blocked<\/code> reasons, status words, tooltips on icon-only buttons.<\/li><li>Keep targets at least 44 units on both axes. Run the PlayMode <code>FitTests<\/code> after layout changes.<\/li><li>One <code>Primary<\/code> button per screen. At most two glows on screen.<\/li><li>Back must always do something, even if that is only <code>Fallback<\/code>.<\/li><\/ul>\n<h4>9. Your own components<\/h4>\n<ul><li>Build with <code>Ui.Box<\/code>, <code>Ui.Text<\/code> and <code>VbShape.Attach<\/code>, and name classes BEM-style with your own block prefix.<\/li><li>Read colours and sizes from tokens: <code>var(--vb-color-…)<\/code>, <code>var(--vb-cut-md)<\/code>, <code>var(--vb-font-body-medium)<\/code>.<\/li><li>Put states in modifier classes with <code>Ui.State<\/code>, so USS owns the look.<\/li><li>Uppercase display text in code.<\/li><\/ul>\n<h4>10. Verify<\/h4>\n<div class=\"tablewrap\"><table><thead><tr><th>Check<\/th><th>How<\/th><\/tr><\/thead><tbody><tr><td>Tokens and generated files<\/td><td><code>python3 Tools~/tokens.py --check<\/code>, <code>python3 Tools~/samples.py --check<\/code><\/td><\/tr><tr><td>EditMode<\/td><td><code>Tests/Editor<\/code>: navigation, world layer, ports, tokens, icons<\/td><\/tr><tr><td>PlayMode<\/td><td><code>Tests/Runtime/FitTests<\/code> renders the kit at widths 320–430<\/td><\/tr><tr><td>Clean consumer<\/td><td>The repository's <code>tools/verify-packages.py<\/code> copies the package and both samples into an empty project and compiles them<\/td><\/tr><\/tbody><\/table><\/div>"}</script>

<script>
(function () {

  var view = document.getElementById('view'), side = document.getElementById('side');
  var roots = [];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    function done() { toast('Copied · ' + (label || text.split('\n')[0].slice(0, 60))); }
    try { navigator.clipboard.writeText(text).then(done, function () { toast('Select the text to copy'); }); } catch (e) { toast('Select the text to copy'); }
  }

  /* ── C#, UXML and USS highlighting (small, safe: escape first) ── */
  function hl(code, lang) {
    var re, kinds;
    if (lang === 'uss') { re = /(\/\*[\s\S]*?\*\/)|(--vb-[a-z0-9-]+)|(\.[a-z][a-z0-9_-]*)/g; kinds = ['c', 's', 'k']; }
    else if (lang === 'uxml') { re = /(<\/?[\w:.]+)|([\w-]+)(?==")|("[^"]*")/g; kinds = ['k', 't', 's']; }
    else { re = /(\/\/[^\n]*|#[^\n]*)|("[^"\n]*")|\b(new|var|void|public|class|static|return|null|true|false|foreach|in|if|float|int|string|bool|readonly|const|event)\b|\b(Vb[A-Z]\w*|Ui|Popover|Dialog|Navigator|SafeAreaRoot|ButtonVariant|StatusKind|RarityTier|WorldTeam|PlatformState|[A-Z]\w*(?:Component|Composite|Layout|View|ViewModel))\b/g; kinds = ['c', 's', 'k', 't']; }
    var out = '', last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index));
      var k = 0; for (var g = 1; g < m.length; g++) if (m[g] != null) { k = g; break; }
      out += '<span class="' + kinds[k - 1] + '">' + esc(m[0]) + '</span>'; last = re.lastIndex;
      if (m[0].length === 0) re.lastIndex++;
    }

  }
  function codebox(label, code, lang) {

  function applyFlags() {
    ['slim', 'contrast', 'motion'].forEach(function (k) { document.getElementById('t-' + k).setAttribute('aria-pressed', flags[k] ? 'true' : 'false'); });
    document.querySelectorAll('[data-stage]').forEach(function (el) {

  ['slim', 'contrast', 'motion'].forEach(function (k) {
    document.getElementById('t-' + k).addEventListener('click', function () { flags[k] = !flags[k]; store(k, flags[k] ? '1' : '0'); applyFlags(); });
  });

  /* ── previews ── */

  function mountPreview(host, x) {

    var el = document.createElement('div'); el.setAttribute('data-stage', ''); el.setAttribute('data-base', base);
    if (phone) {
      var hold = document.createElement('div'); hold.className = 'phone-hold';

  function navHtml() {

    function link(r, t, n) { return '<a href="#' + r + '" data-r="' + r + '">' + esc(t) + (n != null ? '<small>' + n + '</small>' : '') + '</a>'; }
  }

  function tokenVal(name) {

  function swatch(v) { return /^(#|rgb|var\()/.test(v) ? v.replace(/var\(--([a-z0-9-]+)\)/, 'var(--$1)') : 'transparent'; }

  function overview() {

    var o = '<div class="eyebrow">' + esc(D.package.name) + ' · v' + esc(D.package.version) + ' · Unity ' + esc(D.package.unity) + '</div>' +
      '<h1>Veilbreak GUI Handbook</h1><p class="lede">The Veil design system as you use it in Unity: every component sorted into atoms, composites, layouts and views, with the UI Toolkit type that implements it, the USS it is painted from, the tokens it reads and a live preview of its web mirror.</p>';
    o += '<div class="tiers">';
    D.tiers.forEach(function (t) {
      var list = D.entries.filter(function (x) { return x.tier === t.id; }), c = counts(list), n = list.length;
      o += '<section class="tier slim"><div class="tier__n">' + n + '</div><div class="tier__name">' + esc(t.name) + '</div><p>' + esc(t.blurb) + '</p><div class="tier__list">' +
        list.map(function (x) { return '<a href="#e-' + x.id + '"><i class="dot dot--' + x.status + '"></i><span>' + esc(x.name) + '</span></a>'; }).join('') + '</div>' +
        '<div class="statusbar" title="' + c.shipped + ' shipped · ' + c.partial + ' partial · ' + c.proposed + ' proposed"><i style="flex:' + c.shipped + ';background:var(--hb-teal)"></i><i style="flex:' + c.partial + ';background:var(--hb-amber)"></i><i style="flex:' + c.proposed + ';background:var(--hb-lav)"></i></div></section>';
    });
    o += '<section class="tier slim"><div class="tier__n">' + D.icons.length + '</div><div class="tier__name">Assets</div><p>Stroke icons, the mark and the fonts, with their USS classes and files.</p><div class="tier__list"><a href="#icons"><i class="dot dot--shipped"></i><span>Icon pack</span></a><a href="#fonts"><i class="dot dot--shipped"></i><span>Fonts &amp; mark</span></a><a href="#tokens"><i class="dot dot--shipped"></i><span>Tokens · ' + D.tokens.length + '</span></a></div></section></div>';
    o += '<div class="legend"><span><i class="dot dot--shipped"></i>' + all.shipped + ' shipped · in the package as described</span><span><i class="dot dot--partial"></i>' + all.partial + ' partial · exists, contract incomplete</span><span><i class="dot dot--proposed"></i>' + all.proposed + ' proposed · spec only</span></div>';
    o += '<div class="callout slim"><div><div class="eyebrow">New in the system</div><h3>Two kinds of frame</h3><p>Containers move to a <strong>slim</strong> frame: a 4-unit chamfer and no border. The chipped frame stays for what you act on or what is selected. It is pure USS on the existing <code>VbShape</code>, so no C# changes.</p><p>Switch on <strong>Slim containers</strong> in the top bar to see any screen in the handbook on the slim frame.</p><a class="go" href="#e-frame">FrameComponent →</a></div><div id="ov-preview"></div></div>';
    o += '<h2>From an empty scene to a running board</h2><div class="steps">' +

    view.innerHTML = o;
    var host = document.getElementById('ov-preview');

  function entry(x) {

      '<div class="chips"><span class="chip" style="background:none;padding-left:0">Unity today</span>' + x.unity.map(function (u) { return '<span class="chip chip--code">' + esc(u) + '</span>'; }).join('') + '</div></div>';

      '<div class="stage__bar"><span>' + (x.stage === 'board' ? 'Portrait board · 390 × 844' : 'Preview') + ' · web mirror</span>' + (x.stage === 'board' ? '<button id="actual">Actual size</button>' : '') + '</div>' +
      '<div class="stage__body' + (x.stage === 'board' ? '' : ' stage__body--free') + '" id="stage-host">' + (x.hasPreview ? '' : '<p style="padding:16px;color:var(--hb-ink-3)">No preview.</p>') + '</div></section>';

    o += '<div class="panel" data-panel="unity"' + (cur === 'unity' ? '' : ' hidden') + '>' + codebox('C#', x.csharp, 'cs') + codebox('UXML · xmlns:vb="Veilbreak.Gui"', x.uxml, 'uxml') +

  function tokensPage() {
    var fams = []; D.tokens.forEach(function (t) { if (fams.indexOf(t.family) < 0) fams.push(t.family); });
    var cur = store('fam') || 'color';
    var o = '<div class="eyebrow">Foundations</div><h1>Tokens</h1><p class="lede">One source, <code>Tokens~/tokens.json</code>, generated by <code>Tools~/tokens.py</code> into <code>Tokens.uss</code> (variables), <code>TokensContrast.uss</code> and <code>VbTokens.cs</code> (colours for code). Click a row to copy its USS variable.</p>' +
      '<div class="fams" role="group" aria-label="Family">' + fams.map(function (f) { return '<button class="fam" data-fam="' + f + '" aria-pressed="' + (f === cur) + '">' + f + '</button>'; }).join('') + '</div><div id="tok"></div>';
    view.innerHTML = o;
    function draw() {
      var rows = D.tokens.filter(function (t) { return t.family === cur; });
      var c = cur === 'color';
      document.getElementById('tok').innerHTML = '<div class="tablewrap"><table><thead><tr>' + (c ? '<th></th>' : '') + '<th>Token</th><th>Veil</th>' + (c ? '<th>Contrast</th>' : '') + '<th>USS</th>' + (c ? '<th>C#</th>' : '') + '<th>Usage</th></tr></thead><tbody>' +
        rows.map(function (t) {
          return '<tr class="click" data-copy="' + esc(t.uss ? 'var(' + t.uss + ')' : t.name) + '">' + (c ? '<td><span class="sw"><i style="background:var(--' + esc(t.name) + ')"></i></span></td>' : '') +
            '<td class="mono">' + esc(t.name) + (t.proposed ? ' <span class="pill pill--proposed" style="padding:3px 6px">proposed</span>' : '') + '</td><td class="mono">' + esc(t.veil) + '</td>' + (c ? '<td class="mono">' + esc(t.contrast || '—') + '</td>' : '') +
            '<td class="mono">' + esc(t.uss || '—') + '</td>' + (c ? '<td class="mono">' + esc(t.cs || '—') + '</td>' : '') + '<td style="min-width:240px">' + esc(t.usage) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    view.querySelectorAll('.fam').forEach(function (b) { b.addEventListener('click', function () { cur = b.getAttribute('data-fam'); store('fam', cur); view.querySelectorAll('.fam').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); draw(); }); });
    draw();
  }

  function typePage() {
    var fam = { display: 'var(--font-display)', body: 'var(--font-body)', hud: 'var(--font-hud)' };
    var o = '<div class="eyebrow">Foundations</div><h1>Type</h1><p class="lede">TeX Gyre Adventor for titles, names and CTAs; Poppins for everything else; Share Tech Mono for HUD numerals. UI Toolkit has no <code>text-transform</code>: caps are passed in code. Font files are referenced as <code>-unity-font-definition: var(--vb-font-&lt;family&gt;-&lt;weight&gt;)</code>.</p>';
    o += D.type.map(function (s) {
      return '<div class="spec-row"><div class="meta"><b>' + esc(s.name) + '</b>' + esc(s.group) + ' · ' + esc(s.fontSize) + ' / ' + esc(s.lineHeight) + ' · ' + esc(s.fontWeight) + (s.letterSpacing ? ' · ' + esc(s.letterSpacing) : '') + (s.uss ? '<br>' + esc(s.uss) : '') + '</div>' +
        '<div><div class="sample" style="font-family:' + fam[s.family] + ';font-size:' + s.fontSize + ';line-height:' + s.lineHeight + ';font-weight:' + s.fontWeight + ';letter-spacing:' + (s.letterSpacing || 'normal') + '">' + esc(s.sample || s.name) + '</div><div style="font-size:12.5px;color:var(--hb-ink-3);margin-top:4px">' + esc(s.usage || '') + '</div></div></div>';
    }).join('');
    view.innerHTML = o;
  }

  function iconsPage() {
    var fams = ['All']; D.icons.forEach(function (i) { if (fams.indexOf(i.family) < 0) fams.push(i.family); });
    var cur = 'All', q = '';
    var o = '<div class="eyebrow">Assets</div><h1>Icon pack</h1><p class="lede">' + D.icons.length + ' stroke glyphs on a 24 grid (<code>Runtime/Icons/*.svg</code>, imported as vector images) plus ' + Object.keys(D.aliases).length + ' design-system aliases. <code>Icons.uss</code> maps <code>vb-icon--{name}</code> to each file. Click a glyph to copy <code>new VbIcon("name", 16)</code>.</p>' +
      '<div class="fams">' + fams.map(function (f) { return '<button class="fam" data-f="' + esc(f) + '" aria-pressed="' + (f === cur) + '">' + esc(f) + '</button>'; }).join('') + '</div>' +
      '<label class="search" style="display:block;max-width:360px;margin-bottom:12px"><input id="iq" type="search" placeholder="Filter icons" aria-label="Filter icons"></label><div class="icons" id="ig"></div>';
    view.innerHTML = o;
    var grid = document.getElementById('ig'), root = ReactDOM.createRoot(grid); roots.push(root);
    function draw() {
      var list = D.icons.filter(function (i) { return (cur === 'All' || i.family === cur) && (!q || i.name.indexOf(q) >= 0 || i.aliases.join(' ').indexOf(q) >= 0); });
      root.render(list.map(function (i) {
        return h('button', { key: i.name, className: 'ic slim', title: '.vb-icon--' + i.name + ' · ' + i.file, onClick: function () { copy('new VbIcon("' + i.name + '", 16)'); } },
          h(V.VbIcon, { icon: i.name, size: 28 }), h('span', null, i.name), i.aliases.length ? h('small', null, '= ' + i.aliases.join(', ')) : null);
      }));
    }
    view.querySelectorAll('.fam').forEach(function (b) { b.addEventListener('click', function () { cur = b.getAttribute('data-f'); view.querySelectorAll('.fam').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); draw(); }); });
    document.getElementById('iq').addEventListener('input', function (e) { q = e.target.value.trim().toLowerCase(); draw(); });
    draw();
  }

  function fontsPage() {
    var o = '<div class="eyebrow">Assets</div><h1>Fonts &amp; mark</h1><p class="lede">Font files live in <code>Runtime/Fonts/</code>; <code>FontPrimer</code> fills every face\'s dynamic atlas with the kit\'s glyphs on the first layout pass, so tracking never depends on which characters a session showed first.</p>';
    o += '<div class="tablewrap"><table><thead><tr><th>Family</th><th>Weight</th><th>File</th><th>USS variable</th></tr></thead><tbody>' + D.fonts.map(function (f) { return '<tr><td style="font-family:\'' + esc(f.family) + '\';font-weight:' + f.weight + ';font-size:16px;color:var(--hb-ink)">' + esc(f.family) + '</td><td class="mono">' + esc(f.weight) + '</td><td class="mono">Runtime/' + esc(f.file.replace(/^fonts\//, 'Fonts/')) + '</td><td class="mono">' + esc(f.uss || '—') + '</td></tr>'; }).join('') + '</tbody></table></div>';
    o += '<h2>The mark</h2><p class="prose"><code>VbMark</code> draws the VEIL/BREAK mark from <code>MarkGeometry</code> (15 parts) at a width; the splash uses the same data. Open <a class="ref" href="#e-mark">MarkComponent</a> for usage.</p><div class="stage slim" style="max-width:520px"><div class="stage__body stage__body--free" id="mark-host"></div></div>';
    view.innerHTML = o;
    mountPreview(document.getElementById('mark-host'), E.mark);
  }

  function setupPage() {
    view.innerHTML = '<div class="eyebrow">Start</div><h1>Unity setup</h1><p class="lede">From <code>Documentation~/integration.md</code> in the package.</p><div class="prose">' + D.integration + '</div>' +
      '<h2>Regenerate</h2>' + codebox('Shell', 'python3 Tools~/tokens.py          # Tokens.uss, TokensContrast.uss, VbTokens.cs, tokens.md\npython3 Tools~/icons.py           # Icons.uss from Runtime/Icons/*.svg\nTools~/web/build.sh OUT           # the design-system artifact\npython3 Tools~/handbook/build_handbook.py . OUT --arcade ../..   # this handbook', 'sh') +
      '<h2>Slim frame · USS</h2>' + codebox('Gui.uss', D.slimUss, 'uss') + codebox('Migration of today\'s containers', D.slimMigration, 'uss');
  }

  /* ── search ── */
  var q = document.getElementById('q');
  function searchPage(term) {
    term = term.toLowerCase();
    var hits = D.entries.filter(function (x) { return (x.name + ' ' + x.unity.join(' ') + ' ' + x.summary + ' ' + x.blocks.join(' ')).toLowerCase().indexOf(term) >= 0; });
    var toks = D.tokens.filter(function (t) { return (t.name + ' ' + (t.uss || '') + ' ' + (t.cs || '')).toLowerCase().indexOf(term) >= 0; }).slice(0, 30);
    var ics = D.icons.filter(function (i) { return i.name.indexOf(term) >= 0; }).slice(0, 40);
    var o = '<div class="eyebrow">Search</div><h1>“' + esc(term) + '”</h1>';
    o += '<h2>Components · ' + hits.length + '</h2>' + (hits.length ? '<div class="tablewrap"><table><tbody>' + hits.map(function (x) { return '<tr class="click" data-go="e-' + x.id + '"><td class="mono">' + esc(x.name) + '</td><td>' + esc(TIER[x.tier].name) + '</td><td>' + x.unity.map(function (u) { return '<code>' + esc(u) + '</code>'; }).join(' ') + '</td><td>' + pill(x.status) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="prose">No component matches.</p>');
    if (toks.length) o += '<h2>Tokens · ' + toks.length + '</h2><div class="chips">' + toks.map(function (t) { return '<button class="chip chip--code" style="border:0;cursor:pointer" data-copy="' + esc(t.uss ? 'var(' + t.uss + ')' : t.name) + '">' + esc(t.uss || t.name) + '</button>'; }).join('') + '</div>';
    if (ics.length) o += '<h2>Icons · ' + ics.length + '</h2><div class="chips">' + ics.map(function (i) { return '<button class="chip chip--code" style="border:0;cursor:pointer" data-copy="new VbIcon(&quot;' + esc(i.name) + '&quot;, 16)">' + esc(i.name) + '</button>'; }).join('') + '</div>';
    view.innerHTML = o;
  }
  q.addEventListener('input', function () { var t = q.value.trim(); if (t.length >= 2) { unmount(); searchPage(t); } else if (!t) route(); });

  /* ── router ── */
  function route() {
    unmount(); document.body.classList.remove('nav-open');
    var r = (location.hash || '#overview').slice(1);
    side.querySelectorAll('a').forEach(function (a) { if (a.getAttribute('data-r') === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (r.indexOf('e-') === 0 && E[r.slice(2)]) entry(E[r.slice(2)]);
    else if (r === 'tokens') tokensPage(); else if (r === 'type') typePage(); else if (r === 'icons') iconsPage(); else if (r === 'fonts') fontsPage();
    else if (r === 'name-map') nameMap(); else if (r === 'setup') setupPage(); else overview();
    window.scrollTo(0, 0);
    var cur = side.querySelector('[aria-current]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
  }
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-copy]'); if (c) { e.preventDefault(); copy(c.getAttribute('data-copy')); return; }
    var g = e.target.closest('[data-go]'); if (g) { location.hash = g.getAttribute('data-go'); }
  });
  window.addEventListener('hashchange', route);
  applyFlags();
  route();
})();

</script>
