<style>
/* Layout: sticky top bar · tier sidebar · one entry at a time in the main column (preview beside its facts on wide screens). */
:root {
  --hb-bg: #08050c; --hb-surface: #120c19; --hb-surface-2: #1a1324; --hb-surface-3: #241a31;
  --hb-line: rgba(250, 238, 244, .10); --hb-line-2: rgba(250, 238, 244, .18);
  --hb-ink: #faeef4; --hb-ink-2: rgba(250, 238, 244, .74); --hb-ink-3: rgba(250, 238, 244, .55);
  --hb-teal: #1dd9a0; --hb-teal-ink: #8ff0cf; --hb-amber: #ffc35a; --hb-lav: #c084fc; --hb-lav-ink: #d9b8ff; --hb-pink: #f39bc6;
  --hb-display: 'TeX Gyre Adventor', 'Century Gothic', 'Avenir Next', sans-serif;
  --hb-body: Poppins, 'Avenir Next', system-ui, sans-serif;
  --hb-mono: 'Share Tech Mono', ui-monospace, Menlo, monospace;
  --hb-cut: 4px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--hb-bg); color: var(--hb-ink); }
body { margin: 0; font: 400 14px/1.6 var(--hb-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hb-bg); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hb-teal-ink); outline-offset: 2px; }
code, pre { font-family: var(--hb-mono); }
.slim { clip-path: polygon(var(--hb-cut) 0, 100% 0, 100% calc(100% - var(--hb-cut)), calc(100% - var(--hb-cut)) 100%, 0 100%, 0 var(--hb-cut)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(8, 5, 12, .94); border-bottom: 1px solid var(--hb-line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar__in { display: flex; align-items: center; gap: 14px; min-height: 56px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; white-space: nowrap; }
.brand b { font: 700 15px/1 var(--hb-display); letter-spacing: .28em; }
.brand b i { font-style: normal; color: var(--hb-ink-3); letter-spacing: .1em; }
.brand span { font: 700 10px/1 var(--hb-body); letter-spacing: .2em; color: var(--hb-teal-ink); }
.menu-btn { display: none; background: var(--hb-surface-2); border: 0; padding: 8px 12px; font: 700 11px/1 var(--hb-body); letter-spacing: .14em; cursor: pointer; }
.search { flex: 1 1 220px; min-width: 0; max-width: 360px; }
.search input { width: 100%; background: var(--hb-surface-2); border: 1px solid transparent; color: var(--hb-ink); font: 400 13px/1 var(--hb-body); padding: 10px 12px; }
.search input:focus { outline: none; border-color: var(--hb-teal); }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tog { display: inline-flex; align-items: center; gap: 8px; background: var(--hb-surface-2); border: 0; padding: 8px 10px; font: 700 10px/1 var(--hb-body); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; color: var(--hb-ink-2); }
.tog i { width: 22px; height: 12px; background: var(--hb-surface-3); position: relative; flex: none; }
.tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 8px; height: 8px; background: var(--hb-ink-3); transition: left .2s; }
.tog[aria-pressed="true"] { color: var(--hb-ink); }
.tog[aria-pressed="true"] i { background: var(--hb-teal); }
.tog[aria-pressed="true"] i::after { left: 12px; background: #0e0914; }

/* frame */
.frame { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: calc(100vh - 57px); }
nav.side { border-right: 1px solid var(--hb-line); padding: 18px 12px 40px max(16px, env(safe-area-inset-left, 0px)); position: sticky; top: calc(57px + env(safe-area-inset-top, 0px)); height: calc(100vh - 57px - env(safe-area-inset-top, 0px)); overflow-y: auto; }
.side h3 { font: 700 10px/1 var(--hb-body); letter-spacing: .2em; color: var(--hb-ink-3); margin: 18px 8px 8px; display: flex; justify-content: space-between; }
.side h3:first-child { margin-top: 0; }
.side a { display: flex; align-items: center; gap: 8px; padding: 5px 8px; text-decoration: none; color: var(--hb-ink-2); font-size: 13px; line-height: 1.35; }
.side a:hover { background: var(--hb-surface); color: var(--hb-ink); }
.side a[aria-current="page"] { background: var(--hb-surface-2); color: var(--hb-ink); }
.side a small { margin-left: auto; font: 400 11px/1 var(--hb-mono); color: var(--hb-ink-3); }
.dot { width: 7px; height: 7px; flex: none; }
.dot--shipped { background: var(--hb-teal); }
.dot--partial { background: var(--hb-amber); transform: rotate(45deg); width: 6px; height: 6px; }
.dot--proposed { border: 1.5px solid var(--hb-lav); }
main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, 3vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 3vw); }
.wrap { max-width: 1180px; }

/* type */
.eyebrow { font: 700 11px/1 var(--hb-body); letter-spacing: .2em; color: var(--hb-ink-3); text-transform: uppercase; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h1 { font: 700 clamp(26px, 4vw, 38px)/1.1 var(--hb-display); letter-spacing: .06em; margin: 10px 0 8px; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font: 700 13px/1 var(--hb-body); letter-spacing: .2em; text-transform: uppercase; color: var(--hb-ink-2); margin: 36px 0 12px; }
h4 { font: 700 12px/1.3 var(--hb-body); letter-spacing: .1em; text-transform: uppercase; color: var(--hb-ink-2); margin: 18px 0 6px; }
.lede { font-size: 16px; color: var(--hb-ink-2); max-width: 68ch; margin: 0 0 14px; text-wrap: pretty; }
.prose { max-width: 76ch; color: var(--hb-ink-2); }
.prose p, .prose li { color: var(--hb-ink-2); }
.prose strong { color: var(--hb-ink); }
.prose ul { padding-left: 18px; margin: 6px 0; }
.prose li { margin: 4px 0; }
.prose code, .lede code, td code, .chip code { font-size: .92em; background: var(--hb-surface-2); padding: 1px 5px; color: var(--hb-teal-ink); }
.prose .ref { color: var(--hb-ink); border-bottom: 1px dotted var(--hb-ink-3); }

/* pills, chips */
.pill { display: inline-flex; align-items: center; gap: 7px; font: 700 10px/1 var(--hb-body); letter-spacing: .14em; text-transform: uppercase; padding: 6px 9px; background: var(--hb-surface-2); }
.pill--shipped { color: var(--hb-teal-ink); } .pill--partial { color: var(--hb-amber); } .pill--proposed { color: var(--hb-lav-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; background: var(--hb-surface-2); font: 500 12px/1.2 var(--hb-body); color: var(--hb-ink-2); text-decoration: none; }
a.chip:hover { background: var(--hb-surface-3); color: var(--hb-ink); }
.chip--code { font: 400 12.5px/1.2 var(--hb-mono); color: var(--hb-teal-ink); }

/* entry */
.entry-head { display: grid; gap: 4px; margin-bottom: 18px; }
.entry-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 320px); gap: 18px; align-items: start; }
.stage { background: var(--hb-surface); padding: 0; min-width: 0; }
.stage__bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; font: 700 10px/1 var(--hb-body); letter-spacing: .16em; color: var(--hb-ink-3); text-transform: uppercase; border-bottom: 1px solid var(--hb-line); flex-wrap: wrap; }
.stage__bar button { background: none; border: 0; cursor: pointer; font: inherit; letter-spacing: inherit; color: var(--hb-teal-ink); padding: 2px 0; }
.stage__body { overflow: auto; display: flex; justify-content: center; }
.stage__body--free { justify-content: flex-start; }
.stage__body > .hb-free { width: 100%; min-height: 120px; }
.phone-hold { position: relative; margin: 18px auto; flex: none; }
.phone-hold > .hb-scale { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.facts { display: grid; gap: 12px; }
.fact { background: var(--hb-surface); padding: 12px 14px; }
.fact h5 { margin: 0 0 8px; font: 700 10px/1 var(--hb-body); letter-spacing: .18em; color: var(--hb-ink-3); text-transform: uppercase; }
.fact p { margin: 0; color: var(--hb-ink-3); font-size: 12.5px; }
.swatches { display: grid; gap: 4px; }
.sw { display: flex; align-items: center; gap: 8px; font: 400 12px/1.2 var(--hb-mono); color: var(--hb-ink-2); min-width: 0; }
.sw i { width: 14px; height: 14px; flex: none; box-shadow: inset 0 0 0 1px rgba(250,238,244,.18); }
.sw span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tabs { display: flex; gap: 2px; margin: 26px 0 0; border-bottom: 1px solid var(--hb-line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; font: 700 11px/1 var(--hb-body); letter-spacing: .16em; text-transform: uppercase; color: var(--hb-ink-3); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--hb-ink); border-bottom-color: var(--hb-teal); }
.tab sup { font: 400 10px/1 var(--hb-mono); color: var(--hb-ink-3); margin-left: 4px; }
.panel { padding-top: 16px; }

/* code */
.codebox { position: relative; background: #0c0811; margin: 8px 0 14px; min-width: 0; }
.codebox__head { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; font: 700 10px/1 var(--hb-body); letter-spacing: .16em; color: var(--hb-ink-3); text-transform: uppercase; background: var(--hb-surface); }
.codebox__head button { background: none; border: 0; color: var(--hb-teal-ink); cursor: pointer; font: inherit; letter-spacing: inherit; }
pre.code, .codebox pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 400 12.5px/1.6 var(--hb-mono); color: #e9dcef; background: #0c0811; }
.prose pre.code { margin: 10px 0; }
.k { color: var(--hb-lav-ink); } .s { color: var(--hb-teal-ink); } .c { color: var(--hb-ink-3); } .t { color: var(--hb-amber); } .p { color: var(--hb-pink); }

/* uss */
.rule { padding: 6px 0; border-top: 1px solid var(--hb-line); font: 400 12.5px/1.55 var(--hb-mono); min-width: 0; }
.rule:first-child { border-top: 0; }
.rule b { color: var(--hb-teal-ink); font-weight: 400; overflow-wrap: anywhere; }
.rule em { font-style: normal; color: var(--hb-ink-3); float: right; margin-left: 8px; }
.rule div { color: var(--hb-ink-2); padding-left: 14px; overflow-wrap: anywhere; }

/* tables */
.tablewrap { overflow-x: auto; margin: 8px 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font: 700 10px/1.2 var(--hb-body); letter-spacing: .16em; color: var(--hb-ink-3); text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--hb-line-2); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--hb-line); vertical-align: top; color: var(--hb-ink-2); }
td.mono, .mono { font-family: var(--hb-mono); font-size: 12.5px; color: var(--hb-ink); white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--hb-surface); }

/* overview */
.tiers { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.tier { background: var(--hb-surface); padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.tier__n { font: 400 34px/1 var(--hb-mono); color: var(--hb-ink); }
.tier__name { font: 700 12px/1 var(--hb-body); letter-spacing: .2em; text-transform: uppercase; }
.tier p { margin: 0; font-size: 12.5px; color: var(--hb-ink-3); line-height: 1.5; }
.tier__list { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
.tier__list a { display: flex; gap: 7px; align-items: center; font-size: 12.5px; text-decoration: none; color: var(--hb-ink-2); padding: 3px 0; overflow: hidden; }
.tier__list a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tier__list a:hover { color: var(--hb-ink); }
.statusbar { display: flex; height: 6px; margin-top: auto; }
.statusbar i { display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--hb-ink-3); margin: 12px 0 0; }
.legend span { display: inline-flex; gap: 7px; align-items: center; }
.callout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; background: var(--hb-surface); padding: 18px; margin-top: 12px; align-items: center; }
.callout h3 { font: 700 18px/1.2 var(--hb-display); letter-spacing: .08em; margin: 0 0 8px; }
.callout p { color: var(--hb-ink-2); margin: 0 0 10px; }
.go { display: inline-flex; gap: 8px; align-items: center; font: 700 11px/1 var(--hb-body); letter-spacing: .16em; text-transform: uppercase; color: var(--hb-teal-ink); text-decoration: none; }
.steps { counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.step { background: var(--hb-surface); padding: 14px; counter-increment: s; min-width: 0; }
.step::before { content: counter(s, decimal-leading-zero); display: block; font: 400 12px/1 var(--hb-mono); color: var(--hb-teal-ink); margin-bottom: 8px; }
.step b { display: block; font-size: 13px; margin-bottom: 4px; }
.step p { margin: 0; font-size: 12.5px; color: var(--hb-ink-3); }
.step code { font-size: 11.5px; color: var(--hb-teal-ink); overflow-wrap: anywhere; }

/* icons */
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px; }
.ic { background: var(--hb-surface); border: 0; padding: 14px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; min-width: 0; color: var(--hb-ink); }
.ic:hover { background: var(--hb-surface-2); }
.ic .vb-icon { color: var(--hb-ink); }
.ic span { font: 400 11px/1.2 var(--hb-mono); color: var(--hb-ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ic small { font: 400 10px/1 var(--hb-mono); color: var(--hb-lav-ink); }
.fams { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px; }
.fam { background: var(--hb-surface-2); border: 0; padding: 6px 10px; font: 700 10px/1 var(--hb-body); letter-spacing: .14em; text-transform: uppercase; color: var(--hb-ink-3); cursor: pointer; }
.fam[aria-pressed="true"] { background: var(--hb-teal); color: #0e0914; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--hb-surface-3); padding: 10px 14px; font: 400 12.5px/1.3 var(--hb-mono); z-index: 40; max-width: calc(100vw - 32px); }

/* type specimens */
.spec-row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-top: 1px solid var(--hb-line); align-items: baseline; }
.spec-row .meta { font: 400 12px/1.5 var(--hb-mono); color: var(--hb-ink-3); }
.spec-row .meta b { color: var(--hb-ink); font-weight: 400; display: block; }
.spec-row .sample { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

@media (max-width: 1100px) { .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); } .entry-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  nav.side { display: none; position: fixed; inset: calc(57px + env(safe-area-inset-top, 0px)) 0 0 0; height: auto; z-index: 15; background: var(--hb-bg); border-right: 0; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body.nav-open nav.side { display: block; }
  .menu-btn { display: inline-block; }
  .callout { grid-template-columns: minmax(0, 1fr); }
  .spec-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}
@media (max-width: 520px) { .tiers { grid-template-columns: minmax(0, 1fr); } .toggles { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  <button class="menu-btn" id="menu-btn" aria-controls="side" aria-expanded="false">Menu</button>

  </div>
</div></header>

 "api": []}, {"id": "label", "tier": "atom", "name": "LabelComponent", "unity": ["vb-t-label", "vb-t-badge", "vb-panel__title"], "status": "partial", "summary": "The caps eyebrow over a section, field or value: tracked-out, small, secondary text.", "uses": ["text"], "usedBy": ["card", "field", "fieldset", "stat-readout", "health-bar", "power-strip", "focus-meter", "queue-list", "screen-header", "perk-detail", "squad-view"], "blocks": ["vb-panel__title", "vb-page__label", "vb-section__title"], "stage": "free", "height": 170, "hasPreview": true, "csharp": "Ui.Text(section, \"AUDIO\", \"vb-t-label\", \"vb-section__title\");\nUi.Text(page, \"ROSTER · ALL 8 UNLOCKED\", \"vb-t-label\", \"vb-page__label\");", "uxml": "", "rules": "<ul><li>Always caps, always short: a noun or \"NOUN · COUNT\". Never a sentence.<\/li><li>Labels name what follows; they are never tappable on their own.<\/li><li>Use <code>vb-t-badge<\/code> (10 px) inside chips and cards, <code>vb-t-label<\/code> (11 px) over sections and fields.<\/li><\/ul>", "spec": "<p><strong>Proposed:<\/strong> <code>LabelComponent(text, size: Label|Badge, tone)<\/code> uppercases for you and carries the section rhythm (<code>margin-bottom: 4<\/code>). It replaces the three ad-hoc classes above.<\/p>", "doc": "", "docTitle": "", "uss": [{"file": "Gui.uss", "sel": ".vb-panel__title", "body": "-unity-font-definition: var(--vb-font-body-bold); font-size: 10px; letter-spacing: 14px; color: var(--vb-color-text-2);"}, {"file": "Gui.uss", "sel": ".vb-panel--ally .vb-panel__title", "body": "color: var(--vb-color-ally-text);"}, {"file": "Gui.uss", "sel": ".vb-panel--enemy .vb-panel__title", "body": "color: var(--vb-color-enemy-text);"}, {"file": "Gui.uss", "sel": ".vb-panel--power .vb-panel__title", "body": "color: var(--vb-color-power-text);"}, {"file": "Layout.uss", "sel": ".vb-page__label", "body": "margin-top: 8px; margin-bottom: 6px;"}], "tokens": ["--vb-color-ally-text", "--vb-color-enemy-text", "--vb-color-power-text", "--vb-color-text-2", "--vb-font-body-bold"], "api": []}, {"id": "glitch-text", "tier": "atom", "name": "GlitchTextComponent", "unity": ["GlitchText", "Glitch.In/Out/Pulse/Slam"], "status": "shipped", "summary": "A Label that projects in and out with clipped red/cyan bands. Headlines and announcements only.", "uses": ["text"], "usedBy": ["holo-frame", "route-view", "battle-hud-view"], "blocks": ["vb-glitch"], "stage": "free", "height": 140, "hasPreview": true, "csharp": "var title = new GlitchText { text = \"CHOOSE YOUR ROAD\" }.Classes(\"vb-t-display\").Into(page);\nGlitch.In(title);            // falls back to a fade under vb-reduced-motion / vb-reduced-flashes", "uxml": "", "rules": "<ul><li>One projected headline per screen. Body copy never glitches.<\/li><li>Schedules cancel on replacement and detach; you never have to clean up.<\/li><\/ul>", "spec": "", "doc": "<div class=\"tablewrap\"><table><thead><tr><th>Component<\/th><th>Input<\/th><th>Events / behaviour<\/th><\/tr><\/thead><tbody><tr><td><code>GlitchText<\/code><\/td><td>Ordinary label <code>text<\/code> and USS typography<\/td><td>Eight clipped bands, red/cyan channels. <code>Glitch.In/Out/Pulse/Slam<\/code>; schedules cancel on replacement/detach.<\/td><\/tr><tr><td><code>Announcer<\/code><\/td><td><code>Say(text, alert, milliseconds, interrupt)<\/code><\/td><td>Bounded six-notice queue; critical pre-emption; out before replacement, in then hold then out. Dispose with its host.<\/td><\/tr><tr><td><code>RouteChoice<\/code><\/td><td><code>RouteView<\/code> with wave and two <code>RoadView<\/code> signs<\/td><td><code>Chosen(side)<\/code> once, left 0 / right 1. Full signs exceed 44 units; keyboard Enter/Space. <code>Choose<\/code> supports alternate input.<\/td><\/tr><tr><td><code>MerchantScreen<\/code><\/td><td><code>MerchantView<\/code> with credits, offers, sellable stacks and HP consequences<\/td><td><code>Bought(index)<\/code>, <code>PerkSold(id)<\/code>, <code>HealthSold(actor)<\/code>, <code>Left<\/code>. Host validates and rebinds after each transaction. <code>ScrollOffset<\/code> preserves position.<\/td><\/tr><tr><td><code>CreditsChip<\/code><\/td><td><code>Set(credits)<\/code><\/td><td>Currency icon and integer; formats on change.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>PerkTier.Rare<\/code> is cyan; <code>Epic<\/code> is violet with a short shimmer. Both have explicit text labels. Merchant offer states say why a purchase is blocked (credits, sold, stack cap). Health rows state the before/after HP; fighters that cannot retain 1 HP cannot trade. Instant rewards are excluded from sellable stacks by the host. <code>HudTop<\/code> places pause and icon-only autoplay at the top left. Autoplay retains its state tint and tooltip, speed stays on the right, credits sit beside Power. <code>WaveSlammed<\/code> lets the host request its own bounded camera jolt; the GUI has no dependency on a camera or arcade simulation. The host must use actual safe-area insets, with a small battle fallback.<\/p>", "docTitle": "Projection and the road economy", "uss": [{"file": "Gui.uss", "sel": ".vb-glitch", "body": "overflow: visible;"}, {"file": "Gui.uss", "sel": ".vb-glitch__copy", "body": "position: absolute; left: 0; top: 0; right: 0; bottom: 0; margin: 0; border-width: 0; background-color: rgba(0,0,0,0); white-space: normal;"}, {"file": "Gui.uss", "sel": ".vb-glitch__red", "body": "color: var(--vb-color-glitch-red);"}, {"file": "Gui.uss", "sel": ".vb-glitch__cyan", "body": "color: var(--vb-color-glitch-cyan);"}, {"file": "Gui.uss", "sel": ".vb-glitch__clip", "body": "position: absolute; left: 0; overflow: hidden;"}, {"file": "Gui.uss", "sel": ".vb-glitch__slice", "body": "color: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-reduced-motion .vb-glitch__copy, .vb-reduced-motion .vb-glitch__clip, .vb-reduced-flashes .vb-glitch__copy, .vb-reduced-flashes .vb-glitch__clip, .vb-contrast .vb-glitch__copy, .vb-contrast .vb-glitch__clip", "body": "display: none;"}, {"file": i><strong>USS:<\/strong> <code>vb-mark<\/code>.<\/li><\/ul>", "docTitle": "VbMark", "uss": [{"file": "Gui.uss", "sel": ".vb-mark", "body": "background-image: url(\"../Vectors/Mark.svg\"); -unity-background-scale-mode: scale-to-fit; flex-shrink: 0;"}], "tokens": [], "api": [{"type": "VbMark", "kind": "class", "base": "VisualElement", "file": "Runtime/Controls/Basics.cs", "summary": "The slash-cut VEIL/BREAK mark at a given width.", "members": ["const string ClassName=\"vb-mark\"", "[UxmlAttribute] float Width", "VbMark():this(260)", "VbMark(float width)"]}, {"type": "MarkGeometry", "kind": "class", "base": "", "file": "Runtime/Core/MarkGeometry.cs", "summary": "The Veilbreak mark as separate parts in logo units (the design's 640 × 686 artboard): each letter of VEILBREAK and the four slices of the blade, with absolute M/L/C/Z path data. VbMark draws the composed mark from Vectors/Mark.svg; animated renderers (the intro splash) move the parts independently and fill Rings.", "members": ["static readonly IReadOnlyList<(string id,bool blade,string d)> Parts=new (string,bool,string)[]", "fill them even-odd.<\/summary> static Vector2[][] Rings(string d)"]}]}, {"id": "frame", "tier": "atom", "name": "FrameComponent", "unity": ["VbShape", "VbFrame", "vb-panel", "Ui.Panel"], "status": "partial", "summary": "The surface everything sits on. Two kinds: slim (the default container) and chipped (things you act on or that are selected).", "uses": [], "usedBy": ["button", "badge", "toggle-input", "choice-input", "popover", "backdrop", "tile", "card", "icon-button", "fieldset", "score-row", "perk-row", "dialog", "holo-frame", "holo-platform", "rule-row"], "blocks": ["vb-shape", "vb-panel", "vb-frame"], "stage": "free", "height": 420, "hasPreview": true, "csharp": "// Slim container: the default for sections, sheets, rows and cards\nvar box = Ui.Panel(parent, \"vb-frame--slim\");\n// Chipped: kept for interactive or selected surfaces\nvar link = Ui.Panel(parent, \"vb-panel--raised\");   // today's look", "uxml": "<vb:VbFrame class=\"vb-panel vb-frame--slim\" />\n<vb:VbFrame class=\"vb-panel vb-panel--solid\" />", "rules": "<ul><li><strong>Slim<\/strong> (cut 4, no edge, fill only) for every container: sections, dialog sheets, list rows, cards, popovers, the HUD band.<\/li><li><strong>Chipped<\/strong> (cut 6–14, hairline edge) only where the frame means something: buttons, tiles you pick, the selected thing, holo frames, focus.<\/li><li>Never nest chipped in chipped. A chipped control inside a slim container is the normal case.<\/li><li>Slim frames get their edge back under <code>vb-contrast<\/code> so containers still separate at 3:1.<\/li><li>Fills come from tokens: <code>panel<\/code>, <code>panel-solid<\/code>, <code>raised<\/code>, and the <code>*-soft<\/code> tints behind their own text colour.<\/li><\/ul>", "spec": "<p><strong>New container kind: slim.<\/strong> The kit has one container look today: the chipped frame (10–14 cut, hairline edge). On a portrait screen every section, row and sheet draws its own border, and the screen reads as a stack of outlines (see Settings and Pause). The slim frame drops the edge and shrinks the chamfer to 4, so containers read as quiet tonal planes and the chipped look is left for what you act on.<\/p>\n<p><code>VbShape<\/code> already reads <code>--vb-cut<\/code> and <code>--vb-bw<\/code>, so the slim kind is <strong>pure USS<\/strong>:<\/p>\n<pre class=\"code\"><code>/* Gui.uss — FrameComponent kinds. Add after .vb-panel rules. VbShape already supports both: no C# change. */\n/* Slim: the default container. Small chamfer, no edge, fill only. */\n.vb-frame--slim { --vb-cut: 4; --vb-bw: 0; --vb-fill: var(--vb-color-panel); }\n.vb-frame--slim.vb-frame--raised { --vb-fill: var(--vb-color-raised); }\n.vb-frame--slim.vb-frame--solid  { --vb-fill: var(--vb-color-panel-solid); }\n.vb-frame--slim.vb-frame--ally   { --vb-fill: var(--vb-color-ally-soft); }\n.vb-frame--slim.vb-frame--enemy  { --vb-fill: var(--vb-color-enemy-soft); }\n.vb-frame--slim.vb-frame--power  { --vb-fill: var(--vb-color-power-soft); }\n/* Chipped: the existing look, reserved for things you act on or that are selected. */\n.vb-frame--chipped { --vb-cut: var(--vb-cut-md); --vb-bw: 1; --vb-edge: var(--vb-color-line); }\n/* High contrast: a container with no edge must still separate from the world at 3:1. */\n.vb-contrast .vb-frame--slim { --vb-bw: 1; --vb-edge: var(--vb-color-line-strong); }<\/code><\/pre>\n<p>Proposed token: <code>cut-xs: 4px<\/code> (USS <code>--vb-cut-xs<\/code>). Migration of today's containers is a selector list, below. Use the <strong>Slim containers<\/strong> switch in the preview bar to see it on any screen.<\/p>\n<pre class=\"code\"><code>/* Arcade.uss / Gui.uss — move today&#x27;s containers to the slim kind (same selectors, no markup change). */\n.vb-section, .vb-dialog, .vb-details, .vb-score, .vb-perk-row, .vb-rule, .vb-result,\n.vb-queue__row, .vb-merchant__exchange, .menu__checkpoint, .pause__perks, .results__score,\n.settings__note, .menu__best, .pause__chip {\n    --vb-cut: 4; --vb-bw: 0;\n}\n.vb-contrast .vb-section, .vb-contrast .vb-dialog, .vb-contrast .vb-details, .vb-contrast .vb-score,\n.vb-contrast .vb-perk-row, .vb-contrast .vb-rule, .vb-contrast .vb-result {\n    --vb-bw: 1; --vb-edge: var(--vb-color-line-strong);\n}<\/code><\/pre>", "doc": "<p>The Veil cut shape: top-left and bottom-right chamfers, painted as a mesh because UI Toolkit has no <code>clip-path<\/code>.<\/p>\n<ul><li><strong>API:<\/strong> <code>VbShape.Attach(element)<\/code> returns the element. Attaching twice is a no-op.<\/li><li><strong>USS:<\/strong> reads these properties:<\/li><\/ul>\n<p>  | Property | Meaning |   | --- | --- |   | <code>--vb-cut<\/code> | Chamfer size in units |   | <code>--vb-fill<\/code>, <code>--vb-fill-to<\/code>, <code>--vb-fill-dir<\/code> | Fill colour, optional gradient end, and its direction in degrees (0 = left → right) |   | <code>--vb-edge<\/code>, <code>--vb-edge-to<\/code> | Edge colour and optional gradient end |   | <code>--vb-bw<\/code> | Edge width |   | <code>--vb-dash<\/code> | <code>1<\/code> draws a square dashed frame |   | <code>--vb-bracket<\/code>, <code>--vb-bracket-len<\/code> | L marks on the two square corners |   | <code>--vb-glow<\/code> | Soft outer bleed |<\/p>\n<p>  <code>.vb-shape<\/code> resets them all, because custom properties inherit.<\/p>\n<ul><li><strong>Notes:<\/strong> the content box and hit area stay the element's rectangle. Token colours work directly: <code>--vb-edge: var(--vb-color-ally)<\/code>.<\/li><\/ul>", "docTitle": "VbShape", "uss": [{"file": "Gui.uss", "sel": ".vb-shape", "body": "--vb-cut: 10; --vb-bw: 1; --vb-fill-dir: 0; --vb-dash: 0; --vb-bracket-len: 8; --vb-fill: rgba(0, 0, 0, 0); --vb-fill-to: rgba(0, 0, 0, 0); --vb-edge: rgba(0, 0, 0, 0); --vb-edge-to: rgba(0, 0, 0, 0); --vb-bracket: rgba(0, 0, 0, 0); --vb-glow: rgba(0, 0, 0, 0); background-color: rgba(0, 0, 0, 0); border-width: 0; border-radius: 0;"}, {"file": "Gui.uss", "sel": ".vb-contrast .vb-shape, .vb-reduced-flashes .vb-shape", "body": "--vb-glow: rgba(0, 0, 0, 0);"}, {"file": "Gui.uss", "sel": ".vb-panel", "body": "padding: var(--vb-space-4); --vb-fill: var(--vb-color-panel); --vb-edge: var(--vb-color-line);"}, {"file": "Gui.uss", "sel": ".vb-panel--solid", "body": "--vb-fill: var(--vb-color-panel-solid); --vb-edge: var(--vb-color-line-strong); --vb-cut: 14;"}, {"file": "Gui.uss", "sel": ".vb-panel--raised", "body": "--vb-fill: var(--vb-color-raised); --vb-edge: var(--vb-color-line-strong);"}, {"file": "Gui.uss", "sel": ".vb-panel--glass", "body": "--vb-fill: rgba(14, 9, 20, 0.40); --vb-edge: rgba(250, 238, 244, 0.10);"}, {"file": "Gui.uss", "sel": ".vb-panel--enemy", "body": "--vb-fill: rgba(14, 9, 20, 0.65); --vb-edge: rgba(240, 80, 154, 0.60);"}, {"file": "Gui.uss", "sel": ".vb-panel--ally", "body": "--vb-fill: rgba(16, 38, 40, 0.86); --vb-edge: rgba(29, 217, 160, 0.60);"}, {"file": "Gui.uss", "sel": ".vb-panel--power", "body": "--vb-fill: rgba(30, 18, 44, 0.86); --vb-edge: rgba(192, 132, 252, 0.60);"}, {"file": "Gui.uss", "sel": ".vb-panel--brackets", "body": "--vb-bracket: var(--vb-color-ally);"}, {"file": "Gui.uss", "sel": ".vb-panel__head", "body": "flex-direction: row; justify-content: space-between; align-items: flex-end; margin-bottom: 8px;"}, {"file": "Gui.uss", "sel": ".vb-panel__title", "body": "-unity-font-definition: var(--vb-font-body-bold); font-size: 10px; letter-spacing: 14px; color: var(--vb-color-text-2);"}, {"file": "Gui.uss", "sel": ".vb-panel--ally .vb-panel__title", "body": "color: var(--vb-color-ally-text);"}, {"file": "Gui.uss", "sel": ".vb-panel--enemy .vb-panel__title", "body": "color: var(--vb-color-enemy-text);"}, {"file": "Gui.uss", "sel": ".vb-panel--power .vb-panel__title", "body": "color: var(--vb-color-power-text);"}, {"file": "Gui.uss", "sel": ".vb-panel__meta", "body": "font-size: 10px; color: var(--vb-color-text-3);"}], "tokens": ["--vb-color-ally", "--vb-color-ally-text", "--vb-color-enemy-text", "--vb-color-line", "--vb-color-line-strong", "--vb-color-panel", "--vb-color-panel-solid", "--vb-color-power-text", "--vb-color-raised", "--vb-color-text-2", "--vb-color-text-3", "--vb-font-body-bold", "--vb-space-4"], "api": [{"type": "VbShape", "kind": "class", "base": "", "file": "Runtime/Core/VbShape.cs", "summary": "The Veil cut shape: top-left and bottom-right chamfers, painted as a mesh because UI Toolkit has no clip-path. Every value comes from USS custom properties, so stylesheets own the look: --vb-cut (px) --vb-fill [--vb-fill-to --vb-fill-dir (deg, 0 = left→right)] --vb-edge [--vb-edge-to] --vb-bw (px) --vb-dash (1: square dashed frame, the \"blocked/queued\" look) --vb-bracket [--vb-bracket-len] (L marks on the square corners) --vb-glow (soft outer bleed, the glow budget's CTA/selected look). Content box and hit area stay the element's rectangle. .vb-shape resets every property in Gui.uss because custom properties inherit.", "members": ["const string ClassName=\"vb-shape\"", "/// <summary>Paints <paramref name=\"element\"/> as a cut shape from its stylesheet and returns it.<\/summary> static T Attach<T>(T element) where T:VisualElement", "/// <summary>The chamfered outline of a <paramref name=\"w\"/>×<paramref name=\"h\"/> shape, moved inward by <paramref name=\"inset\"/> (negative grows it).<\/summary> static Vector2[] Outline(float w,float h,float cut,float in"]}, {"type": "VbFrame", "kind": "class", "base": "VisualElement", "file": "Runtime/Core/VbShape.cs", "summary": "A cut-corner panel for UXML: <Veilbreak.Gui.VbFrame class=\"vb-panel\"/>.", "members": ["VbFrame()"]}]}, {"id": "button", "tier": "atom", "name": "ButtonComponent", "unity": ["VbButton", "ButtonVariant"], "status": "shipped", "summary": "A chipped button: primary (one per screen), secondary, light, danger, ghost. Blocked buttons say why.", "uses": ["frame", "text", "icon"], "usedBy": ["button-with-icon", "form", "skill-button", "operative-details", "dialog", "main-menu", "menu-actions", "settings-view", "pause-overlay", "confirm-view", "perk-draft", "results-view", "merchant-view", "guide-view"], "blocks": ["vb-button"], "stage": "free", "height": 440, "hasPreview": true, "csharp": "new VbButton(\"RESUME\", ButtonVariant.Primary, \"Returns to selected speed\", \"chevron\", Resume) { name = \"resume\" }.Into(sheet);\nplay.Blocked = \"Pick 1 more to start\";   // disables, dashes, shows the reason", "uxml": "<vb:VbButton title=\"PLAY\" variant=\"Primary\" sub=\"Squad · 4\" icon=\"chevron\" />", "rules": "<ul><li>One primary per screen, bottom of the thumb zone.<\/li><li>Blocked is never just greyed: the sub line becomes the reason, in under five words.<\/li><li>Buttons stay chipped when containers go slim: the chamfer is how a thumb finds them.<\/li><\/ul>", "spec": "", "doc": "<p>A cut-corner button.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new VbButton(title, ButtonVariant.Primary, sub, icon, click)<\/code>.<\/li><li><strong>API:<\/strong> <code>Title<\/code>, <code>Sub<\/code>, <code>Icon<\/code>, <code>Variant<\/code>, <code>Blocked<\/code>, <code>clicked<\/code>.<\/li><li><strong>States:<\/strong><\/li><ul><li>Variants: <code>vb-button--primary<\/code> (pink → teal glass with a gradient edge and glow; one per screen), <code>--secondary<\/code>, <code>--light<\/code>, <code>--danger<\/code>, <code>--ghost<\/code>.<\/li><li><code>--blocked<\/code>: a non-empty <code>Blocked<\/code> reason disables the button, dashes its frame and shows the reason in place of the sub line.<\/li><\/ul><li><strong>USS:<\/strong> <code>__text<\/code>, <code>__label<\/code>, <code>__sub<\/code>, <code>__icon<\/code>.<\/li><li><strong>Access:<\/strong> focusable, with Enter and Space (it is a <code>Button<\/code>). A blocked button stays legible and says why, in under five words.<\/li><\/ul>", "docTitle": "VbButton", "uss": [{"file": "Gui.uss", "sel": ".vb-button, .vb-button:hover, .vb-button:active, .vb-button:hover:active, .vb-button:focus, .vb-button:disabled", "body": "background-color: rgba(0, 0, 0, 0); border-width: 0; border-radius: 0; opacity: 1;"}, {"file": "Gui.uss", "sel": ".vb-button", "body": "flex-direction: row; align-items: center; min-height: 48px; margin: 0; padding: 8px 16px; color: var(--vb-color-text); -unity-text-align: middle-left; white-space: normal; transition-duration: 0.1s; transition-property: scale; --vb-cut: 10; --vb-fill: var(--vb-color-panel); --vb-edge: var(--vb-color-line-strong);"}, {"file": "Gui.uss", "sel": ".vb-button:hover", "body": "--vb-edge: rgba(250, 238, 244, 0.70);"}, {"file": "Gui.uss", "sel": ".vb-button:active", "body": "scale: 0.97 0.97;"}, {"file": "Gui.uss", "sel": ".vb-button:focus", "body": "--vb-bracket: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-button__text", "body": "flex-grow: 1; flex-shrink: 1;"}, {"file": "Gui.uss", "sel": ".vb-button__label", "body": "-unity-font-definition: var(--vb-font-body-medium); -unity-font-style: bold; font-size: 12px; letter-spacing: 16.667px; color: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-button__sub", "body": "font-size: 11px; color: var(--vb-color-text-2); white-space: normal; margin-top: 1px;"}, {"file": "Gui.uss", "sel": ".vb-button__icon", "body": "width: 20px; height: 20px; margin-left: 10px;"}, {"file": "Gui.uss", "sel": ".vb-button--primary", "body": "min-height: 60px; padding: 8px 18px; --vb-cut: 14; --vb-fill: rgba(240, 80, 154, 0.50); --vb-fill-to: rgba(29, 217, 160, 0.50); --vb-fill-dir: 12; --vb-edge: var(--vb-color-enemy); --vb-edge-to: var(--vb-color-ally); --vb-bw: 1.5; --vb-glow: rgba(29, 217, 160, 0.35);"}, {"file": "Gui.uss", "sel": ".vb-button--primary .vb-button__label", "body": "-unity-font-definition: var(--vb-font-display-bold); -unity-font-style: normal; font-size: 16px; letter-spacing: 10.000px;"}, {"file": "Gui.uss", "sel": ".vb-button--light", "body": "--vb-fill: var(--vb-color-text); --vb-edge: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-button--light .vb-button__label, .vb-button--light .vb-button__sub", "body": "color: var(--vb-color-on-cta);"}, {"file": "Gui.uss", "sel": ".vb-button--light .vb-icon", "body": "-unity-background-image-tint-color: var(--vb-color-on-cta);"}, {"file": "Gui.uss", "sel": ".vb-button--danger", "body": "--vb-edge: var(--vb-color-enemy);"}, {"file": "Gui.uss", "sel": ".vb-button--danger .vb-button__label", "body": "color: var(--vb-color-enemy-text);"}, {"file": "Gui.uss", "sel": ".vb-button--danger .vb-icon", "body": "-unity-background-image-tint-color: var(--vb-color-enemy-text);"}, {"file": "Gui.uss", "sel": ".vb-button--ghost", "body": "--vb-fill: rgba(0, 0, 0, 0); --vb-edge: rgba(0, 0, 0, 0);"}, {"file": "Gui.uss", "sel": ".vb-button--blocked", "body": "--vb-dash: 1; --vb-fill: rgba(0, 0, 0, 0); --vb-fill-to: rgba(0, 0, 0, 0); --vb-edge: var(--vb-color-line-strong); --vb-edge-to: rgba(0, 0, 0, 0); --vb-glow: rgba(0, 0, 0, 0);"}, {"file": "Gui.uss", "sel": ".vb-button--bl sPreview": true, "csharp": "new VbSegmented(new[] { (\"LOW\", \"Stable 30 FPS\"), (\"STANDARD\", \"60 FPS target\") }, settings.quality)\n    .Into(quality).Changed(v => settings.quality = v);", "uxml": "", "rules": "", "spec": "", "doc": "<p>Two to five mutually exclusive peers in one frame. Each can carry its consequence.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new VbSegmented(new[] { (\"LOW\", \"30 FPS\"), (\"STANDARD\", \"60 FPS\") }, selected)<\/code>.<\/li><li><strong>API:<\/strong> <code>value<\/code> (index), <code>SetValueWithoutNotify<\/code>. Raises <code>ChangeEvent&lt;int&gt;<\/code>.<\/li><li><strong>States:<\/strong> <code>vb-segmented--fill<\/code> (three or more options share the row so they fit 320), <code>__option--on<\/code>.<\/li><li><strong>USS:<\/strong> <code>__option<\/code>, <code>__label<\/code>, <code>__sub<\/code>.<\/li><li><strong>Access:<\/strong> each option is a focusable target with Enter and Space.<\/li><\/ul>", "docTitle": "VbSegmented", "uss": [{"file": "Gui.uss", "sel": ".vb-segmented", "body": "flex-direction: row; padding: 3px; --vb-cut: 6; --vb-fill: var(--vb-color-panel); --vb-edge: var(--vb-color-line-strong);"}, {"file": "Gui.uss", "sel": ".vb-segmented__option", "body": "flex-grow: 1; flex-basis: 0; min-height: 44px; padding: 6px 12px; align-items: center; justify-content: center;"}, {"file": "Gui.uss", "sel": ".vb-segmented__label", "body": "-unity-font-definition: var(--vb-font-body-medium); -unity-font-style: bold; font-size: 12px; letter-spacing: 13.333px; color: var(--vb-color-text-2);"}, {"file": "Gui.uss", "sel": ".vb-segmented__sub", "body": "font-size: 11px; color: var(--vb-color-text-3);"}, {"file": "Gui.uss", "sel": ".vb-segmented__option--on", "body": "background-color: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-segmented__option--on .vb-segmented__label", "body": "color: var(--vb-color-on-cta);"}, {"file": "Gui.uss", "sel": ".vb-segmented__option--on .vb-segmented__sub", "body": "color: rgb : only theme sheets reach the panel root.<\/li><\/ul>", "spec": "<p><strong>Slim:<\/strong> the popover body should use <code>vb-frame--slim vb-frame--solid<\/code> instead of today's chipped solid panel.<\/p>", "doc": "<p>Hover, focus and tap popovers. Content is built on demand and placed on the panel root, so it is never clipped, and clamped inside the panel's edges.<\/p>\n<ul><li><strong>Build:<\/strong> <code>Popover.Attach(anchor, () =&gt; content, PopoverPlacement.Below | Above, alignEnd)<\/code>.<\/li><li><strong>API:<\/strong><\/li><ul><li><code>Open()<\/code>, <code>Close()<\/code>, <code>IsOpen<\/code>.<\/li><li><code>Pin()<\/code> keeps it open (galleries, tutorials, captures).<\/li><li><code>Popover.CloseAll()<\/code> returns whether any were open.<\/li><\/ul><li><strong>States:<\/strong> the anchor carries <code>vb-popover-open<\/code>. The content is wrapped in a <code>ScrollView<\/code> with <code>vb-popover<\/code>.<\/li><li><strong>Access:<\/strong> a mouse opens it on hover. Touch toggles it on tap. Focus opens it and blur closes it. It copies the anchor's root flags (<code>SafeAreaRoot.RootClasses<\/code>), so contrast, larger text and the motion settings reach it.<\/li><li><strong>Notes:<\/strong> only theme sheets reach the panel root. Keep the kit in the theme (<code>VeilbreakGui.tss<\/code>).<\/li><\/ul>", "docTitle": "Popover", "uss": [{"file": "Gui.uss", "sel": ".vb-popover", "body": "position: absolute;"}, {"file": "Gui.uss", "sel": ".vb-result:hover, .vb-result.vb-popover-open", "body": "--vb-fill: var(--vb-color-raised); --vb-edge: var(--vb-color-line-strong);"}, {"file": "Gui.uss", "sel": ".vb-perk-chip:hover, .vb-perk-chip.vb-popover-open", "body": "--vb-fill: var(--vb-color-ally-soft); --vb-edge: var(--vb-color-ally);"}, {"file": "Gui.uss", "sel": ".vb-hud__resources:hover, .vb-hud__resources.vb-popover-open", "body": "--vb-edge: rgba(192, 132, 252, 0.45);"}], "tokens": ["--vb-color-ally", "--vb-color-ally-soft", "--vb-color-line-strong", "--vb-color-raised"], "api": [{"type": "Popover", "kind": "class", "base": "", "file": "Runtime/Core/Popover.cs", "summary": "Hover/focus popovers that also work on touch: a pointer that cannot hover toggles on tap. Content is built on demand and placed on the panel's root (so it is never clipped), kept inside the panel's edges. Styles reach it through the panel theme, so put the kit's stylesheets in the theme (VeilbreakGui.tss), not only on a document. It copies the anchor's root flags (SafeAreaRoot.RootClasses), so high contrast, larger text and the motion settings reach it too.", "members": ["const string ClassName=\"vb-popover\",OpenClass=\"vb-popover-open\"", "static bool CloseAll()", "bool IsOpen", "static Popover Attach(VisualElement anchor,Func<VisualElement> build,PopoverPlacement placement=PopoverPlacement.Below,bool alignEnd=false)", "/// <summary>Keeps the popover open until <see cref=\"Close\"/> (galleries, tutorials, captures).<\/summary> void Pin()", "void Open()", "void Close()"]}]}, {"id": "overlay", "tier": "atom", "name": "OverlayComponent", "unity": ["ModalHost", "vb-modal", "Navigator.Push"], "status": "shipped", "summary": "A modal layer: dims and disables what is under it, takes focus, and returns focus when it closes.", "uses": [], "usedBy": ["dialog", "sheet-layout", "pause-overlay", "guide-view"], "blocks": ["vb-modal", "vb-covered"], "stage": "board", "height": 220, "hasPreview": true, "csharp": "var layer = nav.Push(onClose: Resume);   // vb-modal, bottom-docked\nDialog.Sheet(layer, \"LEAVE GAME?\", \"Your profile is saved.\");\nnav.Back();                              // popover → modal → page back → fallback", "uxml": "", "rules": "<ul><li>Back order is fixed: popover, then modal, then the page's back, then the host fallback.<\/li><li>An overlay is never the only way out: Back always closes it.<\/li><\/ul>", "spec": "", "doc": "<p>Nested modal layers over a screen layer.<\/p>\n<ul><li><strong>API:<\/strong><\/li><ul><li><code>Push( uss", "sel": ".vb-button--secondary .vb-button__icon, .vb-button--danger .vb-button__icon", "body": "margin-left: 0; margin-right: 10px;"}, {"file": "Arcade.uss", "sel": ".menu__checkpoint .vb-button__icon", "body": "display: none;"}], "tokens": [], "api": [{"type": "VbButton", "kind": "class", "base": "Button", "file": "Runtime/Controls/Basics.cs", "summary": "Cut-corner button. One ButtonVariant.Primary per screen (pink→teal glass, gradient outline). Blocked buttons stay legible and say why.", "members": ["const string ClassName=\"vb-button\"", "[UxmlAttribute] string Title", "[UxmlAttribute] string Sub", "[UxmlAttribute] string Icon", "[UxmlAttribute] ButtonVariant Variant", "/// <summary>A short reason (under five words). Non-empty disables the button and shows the reason in place of the sub line.<\/summary> [UxmlAttribute] string Blocked", "VbButton():this(\"\")", "VbButton(string title,ButtonVariant variant=ButtonVariant.Secondary,string sub=null,string icon=null,Action click=null)"]}]}, {"id": "icon-button", "tier": "composite", "name": "IconButtonComposite", "unity": ["vb-header__back", "vb-hud__pause", "vb-details__close"], "status": "partial", "summary": "A 44 × 44 chipped square holding one glyph, with a tooltip. Back, pause, close, speed.", "uses": ["frame", "icon"], "usedBy": ["queue-chip", "screen-header", "hud-band", "operative-details"], "blocks": ["vb-header__back", "vb-hud__pause", "vb-details__close"], "stage": "free", "height": 110, "hasPreview": true, "csharp": "// Today each owner builds its own square\nvar back = VbShape.Attach(Ui.Box(header, \"vb-header__back\")).Clickable(Back);\nnew VbIcon(\"back\", 20).Into(back); back.tooltip = \"Back\";", "uxml": "", "rules": "<ul><li>Always 44 × 44 at least, always a tooltip and an accessible name.<\/li><li>Chipped (cut 6): it is a control.<\/li><\/ul>", "spec": "<p><strong>Proposed:<\/strong> <code>IconButtonComposite(icon, tooltip, Action click)<\/code> with <code>--active<\/code> (toggled: AUTO on) a ings.music, v => settings.music = v);   // arcade helper → VbSlider\nSwitch(feel, \"HAPTICS\", \"Light pulse when an order is accepted\", settings.haptics, v => settings.haptics = v);", "uxml": "", "rules": "<ul><li>Height rhythm inside a fieldset: slider 54, switch 62, segmented + 8 gap.<\/li><li>A field explains its consequence in its own detail line or in a caption right under it.<\/li><\/ul>", "spec": "<p><strong>Proposed:<\/strong> <code>FieldComposite(label, input, help)<\/code> for inputs that do not carry their own label (segmented, custom pickers), so every row in a form has the same left label column and help line.<\/p>", "doc": "", "docTitle": "", "uss": [{"file": "Layout.uss", "sel": ".vb-section", "body": "margin-bottom: 12px; padding: 12px 14px;"}, {"file": "Layout.uss", "sel": ".vb-section > .vb-t-label", "body": "margin-bottom: 4px; height: 18px;"}, {"file": "Layout.uss", "sel": ".vb-section > .vb-slider", "body": "height: 54px; min-height: 54px; flex-shrink: 0;"}, {"file": "Layout.uss", "sel": ".vb-section > .vb-switch", "body": "min-height: 62px; flex-shrink: 0;"}, {"file": "Layout.uss", "sel": ".vb-section .vb-segmented", "body": "margin-bottom: 8px;"}], "tokens": [], "api": [{"type": "VbSlider", "kind": "class", "base": "Slider", "file": "Runtime/Controls/Fields.cs", "summary": "The engine slider in Veil dress: a cut track with a teal fill, a square thumb and the value as a number.", "members": ["const string VbClassName=\"vb-slider\"", "VbSlider():this(\"\",0)", "VbSlider(string label,float value,float min=0,float max=1):base(label,min,max)"]}, {"type": "VbSwitch", "kind": "class", "base": "VisualElement,INotifyValueChanged<bool>", "file": "Runtime/Controls/Fields.cs", "summary": "Square on/off switch with a caps label and a line saying what it does. Raises ChangeEvent{T} like any field.", "members": ["const string ClassName=\"vb-switch\"", "[UxmlAttribute] string Text", "[UxmlAttribute] string Detail", "VbSwitch():this(\"\",null,false)", "VbSwitch(string text,string detail,bool value)", "bool value", "void SetValueWithoutNotify(bool newValue)"]}, {"type": "VbSegmented", "kind": "class", "base": "VisualElement,INotifyValueChanged<int>", "file": "Runtime/Controls/Fields.cs", "summary": "2–5 mutually exclusive peers in one cut frame; each option can carry its consequence (\"60 FPS target\").", "members": ["const string ClassName=\"vb-segmented\"", "VbSegmented():this(Array.Empty<(string,string)>(),0)", "VbSegmented(IEnumerable<(string label,string sub)> items,int selected)", "int value", "void SetValueWithoutNotify(int newValue)"]}]}, {"id": "fieldset", "tier": "composite", "name": "FieldsetComposite", "unity": ["Ui.Section", "vb-section"], "status": "shipped", "summary": "A titled group of related fields in one slim container.", "uses": ["frame", "label", "field"], "usedBy": ["form", "settings-view"], "blocks": ["vb-section"], "stage": "free", "height": 240, "hasPreview": true, "csharp": "var audio = Ui.Section(scroll, \"AUDIO\");\nnew VbSlider(\"Master\", s.master).Into(audio).Changed(v => s.master = v);", "uxml": "", "rules": "<ul><li>One topic per fieldset, 1–4 fields. A fieldset title is a LabelComponent, never a sentence.<\/li><li>Slim frame (this is the biggest visual change of the slim proposal).<\/li><\/ul>", "spec": "", "doc": "<div class=\"tablewrap\"><table><thead><tr><th>Class<\/th><th>Use<\/th><\/tr><\/thead><tbody><tr><td><code>vb-root<\/code><\/td><td>Full-size column root<\/td><\/tr><tr><td><code>vb-grow<\/code><\/td><td>Takes free space<\/td><\/tr><tr><td><code>vb-row<\/code>, <code>--between<\/code>, <code>--wrap<\/code><\/td><td>Rows<\/td><\/tr><tr><td><code>vb-half<\/code><\/td><td>Half-width cell<\/td><\/tr><tr><td><code>vb-grid4<\/code><\/td><td>Four tiles or slots per row (wraps)<\/td><\/tr><tr><td><code>vb-grid2<\/code>, <code>__cell<\/code>, <code>--end<\/code><\/td><td>Two-column grid<\/td><\/tr><tr><td><code>vb-section<\/code><\/td><td>A titled settings panel<\/td><\/tr><tr><td><code>vb-large-text<\/code><\/td><td>Larger body and caption type<\/td><\/tr><\/tbody><\/table><\/div>", "docTitle": "Layout classes (`Layout.uss`)", "uss": [{"file": "Layout.uss", "sel": ".vb-section", "body": "margin-bottom: 12px; padding: 12px 14px;"}, {"file": "Layout.uss", "sel": ".vb-section > .vb-t-label", "body": "margin-bottom: 4px; height: 18px;"}, {"file": "Layout.uss", "sel": ".vb-section > .vb-slider", "body": "height: 54px; min-height: 54px; flex-shrink: 0;"}, {"file": "Layout.uss", "sel": ".vb-section > .vb-switch", "body": "min-height: 62px; flex-shrink: 0;"}, {"file": "Layout.uss", "sel": ".vb-section .vb-segmented", "body": "margin-bottom: 8px;"}], "tokens": [], "api": []}, {"id": "form", "tier": "composite", "name": "FormComposite", "unity": ["ArcadeUI.Settings()"], "status": "proposed", "summary": "Fieldsets in a scroll, a saved-state meta in the header, and a footer of secondary actions.", "uses": ["fieldset", "field", "button", "text"], "usedBy": ["settings-view"], "blocks": ["settings__footer", "settings__note"], "stage": "free", "height": 380, "hasPreview": true, "csharp": "// Proposed API\nvar form = new FormComposite { SavedMeta = \"SAVED\" }.Into(page);\nvar audio = form.Fieldset(\"AUDIO\");\naudio.Add(new VbSlider(\"Master\", s.master));\nform.Footer(new VbButton(\"CLEAR LOCAL SCORES\", ButtonVariant.Danger, click: ClearScores));\nform.Changed += SaveProfile;   // applies immediately; no Submit", "uxml": "", "rules": "<ul><li>Settings apply as they change. There is no Submit or OK button; the header meta says SAVED.<\/li><li>Destructive actions live in the footer, danger variant, and confirm with a dialog.<\/li><\/ul>", "spec": "<p><strong>Proposed.<\/strong> <code>ArcadeUI.Settings()<\/code> builds this by hand today (scroll body, <code>Ui.Section<\/code> ×4, a note panel, a footer). A <code>FormComposite<\/code> owns the scroll, the fieldset rhythm, the footer and the change event, so SettingsView and any future options screen stay identical.<\/p>", "doc": "", "docTitle": "", "uss": [{"file": "Arcade.uss", "sel": ".settings__footer", "body": "flex-direction: row; justify-content: space-between; flex-shrink: 0; margin-top: 8px;"}, {"file": "Arcade.uss", "sel": ".settings__footer > .vb-button", "body": "font-size: 10px; padding: 8px 12px;"}, {"file": "Arcade.uss", "sel": ".vb-compact .settings__footer", "body": "flex-direction: column; align-items: flex-start;"}, {"file": "Arcade.uss", "sel": ".vb-compact .settings__footer > .vb-button", "body": "min-height: 44px; margin-top: 4px;"}, {"file": "Arcade.uss", "sel": ".settings__note", "body": "flex-direction: row; align-items: flex-start; padding: 8px 12px; --vb-cut: 6;"}, {"file": "Arcade.uss", "sel": ".settings__note > .vb-icon", "body": "margin-right: 10px; margin-top: 1px; -unity-background-image-tint-color: var(--vb-color-text-2);"}], "tokens": ["--vb-color-text-2"], "api": []}, {"id": "stat-readout", "tier": "composite", "name": "StatReadoutComposite", "unity": ["StatReadout"], "status": "shipped", "summary": "A labelled number with a unit, a previewed delta and an optional bar.", "uses": ["label", "text", "meter"], "usedBy": ["squad-result", "pause-overlay", "results-view"], "blocks": ["vb-stat"], "stage": "free", "height": 190, "hasPreview": true, "csharp": "new StatReadout(\"STANDING\", \"3\", \"/4\").Into(numbers);\nhp.Set(\"1,240\", null, .82f).Delta(\"+60\");", "uxml": "", "rules": "", "spec": "", "doc": "<p>A labelled number with an optional bar.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new StatReadout(\"HEALTH\", \"1,240\", unit, bar01)<\/code>.<\/li><li><strong>API:<\/strong><\/li><ul><li><code>Set(value, unit, bar)<\/code>.<\/li><li><code>Delta(\"+12\")<\/code>: a leading <code>+<\/code> reads up (teal) and <code>−<\/code> down (pink). <code>up<\/code> overrides when lower is better.<\/li><li><code>Tone(\"power\" | \"text\")<\/code>.<\/li><\/ul><li><strong>States:<\/strong> <code>vb-stat--power<\/code>, <code>--text<\/code>, <code>--neutral<\/code>. On the delta: <code>__delta--up<\/code>, <code>__delta--down<\/code>.<\/li><li><strong>USS:<\/strong> <code>__label<\/code>, <code>__row<\/code>, <code>__value<\/code>, <code>__unit<\/code>, <code>__delta<\/code>, <code>__bar<\/code>, <code>__fill<\/code>.<\/li><\/ul>", "docTitle": "StatReadout", "uss": [{"file": "Gui.uss", "sel": ".vb-stat", "body": "flex-grow: 1; flex-basis: 0;"}, {"file": "Gui.uss", "sel": ".vb-stat__label", "body": "-unity-font-definition: var(--vb-font-body-medium); -unity-font-style: bold; font-size: 10px; letter-spacing: 14.000px; color: var(--vb-color-text-3);"}, {"file": "Gui.uss", "sel": ".vb-stat__row", "body": "flex-direction: row; align-items: flex-end;"}, {"file": "Gui.uss", "sel": ".vb-stat__value", "body": "-unity-font-definition: var(--vb-font-body-medium); font-size: 18px; color: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-stat__unit", "body": "font-size: 12px; color: var(--vb-color-text-3); margin-left: 2px; margin-bottom: 2px;"}, {"file": "Gui.uss", "sel": ".vb-stat__bar", "body": "height: 4px; margin-top: 4px; background-color: rgba(250, 238, 244, 0.12);"}, {"file": "Gui.uss", "sel": ".vb-stat__fill", "body": "height: 100%; background-color: var(--vb-color-ally);"}, {"file": "Gui.uss", "sel": ".vb-details__stats .vb-stat", "body": "margin-right: 12px;"}, {"file": "Gui.uss", "sel": ".vb-t-label, .vb-t-badge, .vb-button__label, .vb-switch__label, .vb-header__meta, .vb-hud__key, .vb-hud__auto-label, .vb-hud__auto-state, .vb-operative__chip, .vb-perk-card__category, .vb-perk-card__tag, .vb-perk-detail__tag, .vb-perk-row__tag, .vb-details__role-text, .vb-details__slot, .vb-details__passive-name, .vb-stat__label", "body": "-unity-font-definition: var(--vb-font-body-bold); -unity-font-style: normal;"}, {"file": "Gui.uss", "sel": ".vb-stat__label", "body": "height: 16px; flex-shrink: 0;"}, {"file": "Gui.uss", "sel": ".vb-stat__row", "body": "height: 24px; flex-shrink: 0;"}, {"file": "Gui.uss", "sel": ".vb-stat__bar", "body": "flex-shrink: 0;"}, {"file": "Gui.uss", "sel": ".vb-stat--neutral .vb-stat__fill", "body": "background-color: var(--vb-color-text-2);"}, {"file": "Gui.uss", "sel": ".vb-stat__delta", "body": "margin-left: 5px; margin-bottom: 2px; -unity-font-definition: var(--vb-font-body-semibold); font-size: 12px; color: var(--vb-color-text-2);"}, {"file": "Gui.uss", "sel": ".vb-stat__delta--up", "body": "color: var(--vb-color-ally-text);"}, {"file": "Gui.uss", "sel": ".vb-stat__delta--down", "body": "color: var(--vb-color-enemy-text);"}, {"file": "Gui.uss", "sel": ".vb-stat--power .vb-stat__fill", "body": "background-color: var(--vb-color-power);"}, {"file": "Gui.uss", "sel": ".vb-stat--text .vb-stat__fill", "body": "background-color: var(--vb-color-text-2);"}, {"file": "Arcade.uss", "sel": ".pause__stats > .vb-stat", "body": "margin-right: 12px;"}, {"file": "Arcade.uss", "sel": ".results__stats > .vb-stat", "body": "margin-right: 10px;"}], "tokens": ["--vb-color-ally", "--vb-color-ally-text", "--vb-color-enemy-text", "--vb-color-power", "--vb-color-text", "--vb-color-text-2", "--vb-color-text-3", "--vb-font-body-bold", "--vb-font-body-medium", "--vb-font-body-semibold"], "api": [{"type": "StatReadout", "kind": "class", "base": "VisualElement", "file": "Runtime/Controls/Basics.cs", "summary": "A labelled number with an optional bar (inspectors, results, pause).", "members": ["const string ClassName=\"vb-stat\"", "StatReadout():this(\"\",\"\",null)", "StatReadout(string label,string value,string unit=null,float bar=-1)", "<paramref name=\"up\"/> overrides when lower is better.<\/summary> StatReadout Delta(string change,bool? up=null)", "/// <summary>Bar tone: ally (default), power or text.<\/summary> StatReadout Tone(string tone)", "StatReadout Set(string value,string unit=null,float bar=-1)"]}]}, {"id": "status-badge", "tier": "composite", "name": "StatusBadgeComposite", "unity": ["StatusChip"], "status": "shipped", "summary": "A status with its own glyph and word, so no two statuses read alike and none relies on colour.", "uses": ["badge", "icon", "text"], "usedBy": ["boss-bar", "operative-card"], "blocks": ["vb-status"], "stage": "free", "height": 90, "hasPreview": true, "csharp": "new StatusChip(StatusKind.Silenced, null, \"no skills\", \"1.4s\").Into(chips);", "uxml": "", "rules": "", "spec": "", "doc": "<p>A status with its own glyph and word.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new StatusChip(StatusKind.Silenced, text, detail, time)<\/code>. <code>StatusChip.Icon(kind)<\/code> gives the glyph name.<\/li><li><strong>View model:<\/strong> <code>StatusKind<\/code>: Exposed, Silenced, Rooted, Slowed, Interrupted, Barrier.<\/li><li><strong>States:<\/strong> <code>vb-status--{kind}<\/code>.<\/li><li><strong>USS:<\/strong> <code>__icon<\/code>, <code>__word<\/code>, <code>__detail<\/code>, <code>__time<\/code> (Share Tech Mono).<\/li><li><strong>Access:<\/strong> glyph and word together, so no two statuses read alike and none relies on colour.<\/li><\/ul>", "docTitle": "StatusChip", "uss": [{"file": "Gui.uss", "sel": ".vb-status", "body": "flex-direction: row; align-items: center; height: 22px; padding: 0 8px; margin-right: 6px; --vb-cut: 6; --vb-fill: var(--vb-color-raised); --vb-edge: var(--vb-color-line);"}, {"file": "Gui.uss", "sel": ".vb-status__icon", "body": "width: 14px; height: 14px; margin-right: 5px; -unity-background-image-tint-color: var(--vb-color-warn);"}, {"file": "Gui.uss", "sel": ".vb-status__word", "body": "-unity-font-definition: var(--vb-font-body-medium); -unity-font-style: bold; font-size: 10px; letter-spacing: 10.000px;"}, {"file": "Gui.uss", "sel": ".vb-status__detail", "body": "font-size: 10px; color: var(--vb-color-text-2); margin-left: 4px;"}, {"file": "Gui.uss", "sel": ".vb-status--barrier .vb-status__icon", "body": "-unity-background-image-tint-color: var(--vb-color-barrier);"}, {"file": "Gui.uss", "sel": ".vb-status--exposed", "body": "--vb-fill: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-status--exposed .vb-status__word, .vb-status--exposed .vb-status__detail", "body": "color: var(--vb-color-on-cta);"}, {"file": "Gui.uss", "sel": ".vb-status--exposed .vb-status__icon", "body": "-unity-background-image-tint-color: var(--vb-color-on-cta);"}, {"file": "Gui.uss", "sel": ".vb-status__time", "body": "margin-left: 5px; -unity-font-definition: var(--vb-font-hud-regular); font-size: 11px; color: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-status--exposed .vb-status__time", "body": "color: var(--vb-color-on-cta);"}], "tokens": ["--vb-color-barrier", "--vb-color-line", "--vb-color-on-cta", "--vb-color-raised", "--vb-color-text", "--vb-color-text-2", "--vb-color-warn", "--vb-font-body-medium", "--vb-font-hud-regular"], "api": [{"type": "StatusChip", "kind": "class", "base": "VisualElement", "file": "Runtime/Controls/Basics.cs", "summary": "A status with its own glyph and word, so no two statuses read alike and none relies on colour.", "members": ["const string ClassName=\"vb-status\"", "static string Icon(StatusKind kind)", "StatusChip(StatusKind kind,string text=null,string detail=null,string time=null)"]}]}, {"id": "credits-badge", "tier": "composite", "name": "CreditsBadgeComposite", "unity": ["CreditsChip"], "status": "shipped", "summary": "The currency glyph and an integer; formats on change.", "uses": ["badge", "icon"], "usedBy": ["hud-band", "merchant-view"], "blocks": ["vb-credits"], "stage": "free", "height": 100, "hasPreview": true, "csharp": "var credits = new CreditsChip().Into(power); credits.Set(run.Credits);", "uxml": "", "rules": "", "spec": "", "doc": "<div class=\"tablewrap\"><table><thead><tr><th>Component<\/th><th>Input<\/th><th>Events / behaviour<\/th><\/tr><\/thead><tbody><tr><td><code>GlitchText<\/code><\/td><td>Ordinary label <code>text<\/code> and USS typography<\/td><td>Eight clipped bands, red/cyan channels. <code>Glitch.In/Out/Pulse/Slam<\/code>; schedules cancel on replacement/detach.<\/td><\/tr><tr><td><code>Announcer<\/code><\/td><td><code>Say(text, alert, milliseconds, interrupt)<\/code><\/td><td>Bounded six-notice queue; critical pre-emption; out before replacement, in then hold then out. Dispose with its host.<\/td><\/tr><tr><td><code>RouteChoice<\/code><\/td><td><code>RouteView<\/code> with wave and two <code>RoadView<\/code> signs<\/td><td><code>Chosen(side)<\/code> once, left 0 / right 1. Full signs exceed 44 units; keyboard Enter/Space. <code>Choose<\/code> supports alternate input.<\/td><\/tr><tr><td><code>MerchantScreen<\/code><\/td><td><code>MerchantView<\/code> with credits, offers, sellable stacks and HP consequences<\/td><td><code>Bought(index)<\/code>, <code>PerkSold(id)<\/code>, <code>HealthSold(actor)<\/code>, <code>Left<\/code>. Host validates and rebinds after each transaction. <code>ScrollOffset<\/code> preserves position.<\/td><\/tr><tr><td><code>CreditsChip<\/code><\/td><td><code>Set(credits)<\/code><\/td><td>Currency icon and integer; formats on change.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>PerkTier.Rare<\/code> is cyan; <code>Epic<\/code> is violet with a short shimmer. Both have explicit text labels. Merchant offer states say why a purchase is blocked (credits, sold, stack cap). Health rows state the before/after HP; fighters that cannot retain 1 HP cannot trade. Instant rewards are excluded from sellable stacks by the host. <code>HudTop<\/code> places pause and icon-only autoplay at the top left. Autoplay retains its state tint and tooltip, speed stays on the right, credits sit beside Power. <code>WaveSlammed<\/code> lets the host request its own bounded camera jolt; the GUI has no dependency on a camera or arcade simulation. The host must use actual safe-area insets, with a small battle fallback.<\/p>", "docTitle": "Projection and the road economy", "uss": [{"file": "Gui.uss", "sel": ".vb-credits", "body": "flex-direction: row; align-items: center; flex-shrink: 0; padding: 4px 8px; --vb-cut: 4; --vb-fill: rgba(14,9,20,0.75); ocus.Set(run.Focus, slow: aiming, regenPerSecond: 12.5f, drainPerSecond: 25, slowScale: .2f);", "uxml": "", "rules": "", "spec": "", "doc": "<p>Focus drains in real time while targeting slows combat, and regenerates outside it.<\/p>\n<ul><li><strong>API:<\/strong> <code>Set(focus, slow, regenPerSecond, drainPerSecond, slowScale)<\/code>.<\/li><li><strong>States:<\/strong> <code>vb-focus--slow<\/code>.<\/li><li><strong>USS:<\/strong> <code>__label<\/code>, <code>__meter<\/code>, <code>__value<\/code>, <code>__rate<\/code> (<code>×0.2 · −25/s<\/code>, <code>+12.5/s<\/code> or READY).<\/li><\/ul>", "docTitle": "FocusMeter", "uss": [{"file": "Gui.uss", "sel": ".vb-focus", "body": "flex-direction: row; align-items: center; height: 12px; margin-top: 6px;"}, {"file": "Gui.uss", "sel": ".vb-focus__label", "body": "-unity-font-definition: var(--vb-font-body-medium); -unity-font-style: bold; font-size: 10px; letter-spacing: 24.000px; color: var(--vb-color-text-2); width: 56px;"}, {"file": "Gui.uss", "sel": ".vb-focus__meter", "body": "flex-grow: 1; height: 6px; background-color: rgba(250, 238, 244, 0.10);"}, {"file": "Gui.uss", "sel": ".vb-focus__meter .vb-meter__fill", "body": "background-color: var(--vb-color-text-2);"}, {"file": "Gui.uss", "sel": ".vb-focus__value", "body": "-unity-font-definition: var(--vb-font-body-medium); font-size: 11px; width: 26px; -unity-text-align: middle-right;"}, {"file": "Gui.uss", "sel": ".vb-focus__rate", "body": "-unity-font-definition: var(--vb-font-body-medium); -unity-font-style: bold; font-size: 10px; min-width: 60px; -unity-text-align: middle-right; color: var(--vb-color-text-3);"}, {"file": "Gui.uss", "sel": ".vb-focus--slow .vb-focus__meter .vb-meter__fill", "body": "background-color: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-focus--slow .vb-focus__rate", "body": "color: var(--vb-color-text);"}], "tokens": ["--vb-color-text", "--vb-color-text-2", "--vb-color-text-3", "--vb-font-body-medium"], "api": [{"type": "FocusMeter", "kind": "class", "base": "VisualElement", "file": "Runtime/Controls/Meters.cs", "summary": "Focus: drains in real time while targeting slows combat, regenerates outside it.", "members": ["const string ClassName=\"vb-focus\"", "FocusMeter()", "FocusMeter Set(float focus,bool slow,float regenPerSecond=12.5f,float drainPerSecond=25,float slowScale=.2f)"]}]}, {"id": "skill-button", "tier": "composite", "name": "SkillButtonComposite", "unity": ["SkillButton", "SkillView", "SkillState"], "status": "shipped", "summary": "The 44 × 56 skill control on an operative card. Every blocked state reads differently.", "uses": ["button", "icon", "meter", "badge"], "usedBy": ["operative-card"], "blocks": ["vb-skill"], "stage": "free", "height": 250, "hasPreview": true, "csharp": "var skill = card.Skill(0);                 // A slot; Skill(1) is S\nskill.AddManipulator(new TargetDrag(BeginAim, MoveAim, Release, CancelAim));", "uxml": "", "rules": "", "spec": "", "doc": "<p>A compact 44 × 56 skill control for portrait cards.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new SkillButton().Bind(view)<\/code>. Attach the game's drag or aim manipulator to it.<\/li><li><strong>View model:<\/strong> <code>SkillView<\/code>: <code>label<\/code>, <code>icon<\/code>, <code>slot<\/code> (A or S), <code>kind<\/code>, <code>cost<\/code>, <code>state<\/code>, <code>charged<\/code>, <code>seconds<\/code>, <code>need<\/code>, <code>queue<\/code>, <code>progress<\/code>, <code>reason<\/code>, <code>description<\/code>, <code>fullDescription<\/code>, <code>cooldownSeconds<\/code>.<\/li><li><strong>States:<\/strong> <code>vb-skill--{state}<\/code>. What each state shows:<\/li><\/ul>\n<p>  | State | Shows |   | --- | --- |   | <code>Ready<\/code> | The cost |   | <code>Aiming<\/code> | AIM, with glow |   | <code>Cooldown<\/code> | A fill rising from the bottom, with the seconds |   | <code>Short<\/code> | NEED <em>n<\/em>, dashed |   | <code>Silenced<\/code> | SIL with the seconds, struck |   | <code>F vb-root"], "stage": "board", "height": 220, "hasPreview": true, "csharp": "root.AddToClassList(\"vb-root\");\nvar safe = new SafeAreaRoot(root, panelSettings, screenLayer);   // also primes fonts\nvoid Update() { safe.Refresh(); safe.Flags(s.largeText, s.reducedMotion, s.contrast, s.reducedFlashes); }", "uxml": "", "rules": "<ul><li>Reference 390 × 844, match width (<code>VeilbreakPortrait.asset<\/code>). Insets are panel units with 48 top / 34 bottom minimums.<\/li><li>Root classes: <code>vb-compact<\/code> (&lt; 380 wide), <code>vb-large-text<\/code>, <code>vb-reduced-motion<\/code>, <code>vb-reduced-flashes<\/code>, <code>vb-contrast<\/code>. Popovers copy them.<\/li><\/ul>", "spec": "", "doc": "<p>The one owner of safe-area insets and root flags.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new SafeAreaRoot(root, panelSettings, overlays…)<\/code>. The constructor also calls <code>FontPrimer.Prime(root)<\/code>. This adds the kit's glyphs to every face's dynamic atlas on the first layout pass, so title tracking never depends on the order a session first shows characters.<\/li><li><strong>API:<\/strong><\/li><ul><li><code>Refresh()<\/code> each frame re-applies only when <code>Screen.safeArea<\/code> or the resolution changed.<\/li><li><code>Apply(area, screen)<\/code> sets explicit insets.<\/li><li><code>Insets<\/code> holds the left, top, right and bottom insets in panel units.<\/li><li><code>UnitsPerPixel(screen)<\/code> covers Scale With Screen Size (any match) and Constant Pixel Size.<\/li><li><code>Flags(largeText, reducedMotion, contrast, reducedFlashes)<\/code>.<\/li><li>Fields <code>MinTop<\/code> (48), <code>MinBottom<\/code> (34), <code>CompactWidth<\/code> (380).<\/li><\/ul><li><strong>Root classes:<\/strong> <code>vb-compact<\/code> (board narrower than <code>CompactWidth<\/code>), <code>vb-large-text<\/code>, <code>vb-reduced-motion<\/code>, <code>vb-reduced-flashes<\/code>, <code>vb-contrast<\/code>.<\/li><\/ul>", "docTitle": "SafeAreaRoot", "uss": [{"file": "Layout.uss", "sel": ".vb-root", "body": "flex-grow: 1;"}], "tokens": [], "api": [{"type": "SafeAreaRoot", "kind": "class", "base": "", "file": "Runtime/Core/SafeAreaRoot.cs", "summary": "The one owner of safe-area insets on a portrait board. It pads the root, insets absolute overlays (screen layers) by the same amounts and keeps the root's responsive and accessibility classes. Call Refresh each frame; it only re-applies when the safe area or resolution changed.", "members": ["const string Compact=\"vb-compact\",LargeText=\"vb-large-text\",ReducedMotion=\"vb-reduced-motion\",ReducedFlashes=\"vb-reduced-flashes\",Contrast=\"vb-contrast\"", "popovers, which live on the panel root, copy them from their anchor.<\/summary> static readonly string[] RootClasses", "/// <summary>Minimum top and bottom insets in panel units (status bar and home indicator room on devices that report none).<\/summary> float MinTop=48,MinBottom=34", "/// <summary>Boards narrower than this many panel units get <see cref=\"Compact\"/>.<\/summary> float CompactWidth=380", "SafeAreaRoot(VisualElement root,PanelSettings panel,params VisualElement[] overlays)", "/// <summary>Left, top, right and bottom insets in panel units, as last applied.<\/summary> Vector4 Insets", "true when it did.<\/summary> bool Refresh()", "/// <summary>Insets for a safe area and screen size in pixels.<\/summary> void Apply(Rect area,Vector2 screen)", "/// <summary>Panel units per screen pixel for the panel's scale mode (match width-or-height, constant pixel or physical size).<\/summary> float UnitsPerPixel(Vector2 screen)", "/// <summary>Sets the responsive and accessibility classes on the root: compact board by width, larger text, reduced motion, high contrast /// and reduced flashes (no glows, flicker, chromatic split or bright flashes).<\/"]}]}, {"id": "screen-layout", "tier": "layout", "name": "ScreenLayout", "unity": ["Navigator", "vb-screen", "vb-page"], "status": "shipped", "summary": "One page at a time on the screen layer: optional header, a scroll body, a footer.", "uses": ["screen-header"], "usedBy": ["main-menu", "squad-view", "settings-view", "perk-draft", "results-view", "scores-view"], "blocks": ["vb-screen", "vb-page"], "stage": "board", "height": 220, "hasPreview": true, "csharp": "var page = nav.Open(\"settings\", back: Leave);   // vb-screen--settings > vb-page--settings\nvar header = new ScreenHeader(\"SETTINGS\", \"SAVED\").Into(page); page.AddToClassList(\"vb-page--headed\");\nvar body = Ui.Scroll(page, \"vb-page__scroll\").contentContainer;", "uxml": "", "rules": "<ul><li>Pages are 16 wide gutters; headed pages span the header and keep a 12 gutter.<\/li><li>Back order: popover → modal → page back → fallback. <code>nav.Blocked<\/code> freezes it.<\/li><\/ul>", "spec": "", "doc": "<p>One page at a time on a screen layer, with modal layers and popovers above it.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new Navigator(screenLayer)<\/code>.<\/li><li><strong>API:<\/strong><\/li><ul><li><code>Open(name, back)<\/code> clears the screen and returns an empty page, <code>vb-page vb-page--{name}<\/code>, on <code>vb-screen vb-screen--{name}<\/code>.<\/li><li><code>Push(onClose)<\/code> adds a modal layer over the page.<\/li><li><code>Close()<\/code>, <code>Back()<\/code>, <code>Page<\/code>, <code>Visible<\/code>, <code>Content<\/code>, <code>Modals<\/code>.<\/li><li>Events <code>Opening(name)<\/code> and <code>Closed<\/code>. Hooks <code>Blocked<\/code> (Back does nothing while true), <code>Fallback<\/code> and <code>PageBack<\/code>.<\/li><\/ul><li><strong>Back order:<\/strong> popover, then modal, then <code>PageBack<\/code>, then <code>Fallback<\/code>. It returns false only when nothing handled it.<\/li><li><strong>USS:<\/strong> <code>vb-screen<\/code> and <code>vb-page<\/code>, plus <code>vb-page--headed<\/code> (under a <code>ScreenHeader<\/code>), <code>vb-page__label<\/code>, <code>__caption<\/code>, <code>__footer<\/code> and <code>__scroll<\/code>, all in <code>Layout.uss<\/code>.<\/li><\/ul>", "docTitle": "Navigator", "uss": [{"file": "Layout.uss", "sel": ".vb-screen", "body": "position: absolute; left: 0; right: 0; top: 0; bottom: 0; background-color: rgba(5, 2, 8, 0.86);"}, {"file": "Arcade.uss", "sel": ".vb-screen--route, .vb-screen--merchant", "body": "background-color: rgba(5,2,8,0.88);"}, {"file": "Arcade.uss", "sel": ".vb-screen--menu", "body": "background-color: rgba(5, 2, 8, 0.30);"}, {"file": "Arcade.uss", "sel": ".vb-screen--perks, .vb-screen--build, .vb-screen--revive", "body": "background-color: rgba(5, 2, 8, 0.85);"}, {"file": "Arcade.uss", "sel": ".vb-screen--pause, .vb-screen--confirm", "body": "background-color: rgba(5, 2, 8, 0.80);"}, {"file": "Layout.uss", "sel": ".vb-page", "body": "flex-grow: 1; padding: 0 16px 8px 16px;"}, {"file": "Layout.uss", "sel": ".vb-page > .vb-button", "body": "flex-shrink: 0;"}, {"file": "Layout.uss", "sel": ".vb-page--headed", "body": "padding-left: 0; padding-right: 0;"}, {"file": "Layout.uss", "sel": ".vb-page--headed > *", "body": "margin-left: 12px; margin-right: 12px;"}, {"file": "Layout.uss", "sel": ".vb-page--headed > .vb-header", "body": "margin-left: 0; margin-right: 0;"}, {"file": "Layout.uss", "sel": ".vb-page__label", "body": "margin-top: 8px; margin-bottom: 6px;"}, {"file": "Layout.uss", "sel": ".vb-page__caption", "body": "margin-top: 4px; margin-bottom: 10px;"}, {"file": "Layout.uss", "sel": ".vb-page__footer", "body": "margin-top: 8px; -unity-text-align: middle-center; color: var(--vb-color-text-3);"}, {"file": "Layout.uss", "sel": ".vb-page__scroll", "body": "flex-grow: 1; flex-shrink: 1; min-height: 0;"}, {"file": "Arcade.uss", "sel": ".vb-page--route, .vb-page--merchant", "body": "padding-top: 8px;"}, {"file": "Arcade.uss", "sel": ".vb-page--perks", "body": "padding-top: 16px;"}, {"file": "Arcade.uss", "sel": ".vb-page--results", "body": "padding-top: 12px;"}, {"file": "Arcade.uss", "sel": ".vb-page--pause", "body": "padding-bottom: 0;"}, {"fi
