# Written by `vb roadmap sync` from veil-break/.github-private tools/roadmap/issue-forms; edit the source there. Dropdown
# labels are project 1 field names and their options the field's options: the roadmap workflow reads the answers.
name: Chore
description: "Maintenance, CI, tooling or housekeeping."
labels: ['type: chore']
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: "What needs doing."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: "What the change touches (project 1 Area). Empty: from labels, else unset."
      options:
        - 'tooling'
        - 'characters'
        - 'gui / hud'
        - 'rendering'
        - 'feedback'
        - 'environment'
        - 'gameplay / sim'
        - 'server / net'
        - 'ci'
        - 'docs'
        - 'progression'
        - 'encounters'
    validations:
      required: false
  - type: dropdown
    id: game
    attributes:
      label: Game
      description: "Which game the change reaches (none: producer-only or tooling). Empty: the repository default."
      options:
        - 'main'
        - 'arcade'
        - 'both'
        - 'none'
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "P0 broken main or blocked team · P1 this iteration · P2 next (default) · P3 someday."
      options:
        - 'P0'
        - 'P1'
        - 'P2'
        - 'P3'
    validations:
      required: false
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: "XS < 1 h · S < ½ day (default) · M 1–2 days · L < 1 week · XL split it."
      options:
        - 'XS'
        - 'S'
        - 'M'
        - 'L'
        - 'XL'
    validations:
      required: false
