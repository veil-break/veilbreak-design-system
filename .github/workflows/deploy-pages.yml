name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install locked Python tools
        run: uv sync --locked

      - name: Validate tooling
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen python -m unittest discover -s Tools~/handbook/tests
          uv run --frozen python Tools~/tokens.py --check
          uv run --frozen python Tools~/samples.py --check
          uv run --frozen python Tools~/metas.py --check

      - name: Build handbook and web app
        run: |
          uv run --frozen python Tools~/web/package.py
          uv run --frozen python Tools~/handbook/build_handbook.py . "$RUNNER_TEMP/github-pages"
          git diff --exit-code -- Web~/dist Runtime/Styles/Tokens.uss Runtime/Core/VbTokens.cs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/github-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
