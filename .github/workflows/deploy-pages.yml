name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install locked Python tools
        run: uv sync --locked

      - name: Validate tooling
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen python -m unittest discover -s packages/com.veilbreak.gui/Tools~/handbook/tests
          uv run --frozen python packages/com.veilbreak.gui/Tools~/motion.py --check
          uv run --frozen python packages/com.veilbreak.gui/Tools~/tokens.py --check
          uv run --frozen python packages/com.veilbreak.gui/Tools~/samples.py --check
          uv run --frozen python packages/com.veilbreak.gui/Tools~/metas.py --check
          uv run --frozen python packages/com.veilbreak.ar-hud/Tools~/themes.py --check
          uv run --frozen python packages/com.veilbreak.branding/Tools~/logo.py --check

      - name: ar-hud input checks
        run: dotnet run --project packages/com.veilbreak.ar-hud/Tests~/InputChecks/Veilbreak.ARHud.InputChecks.csproj

      - name: Build handbook and web app
        run: |
          uv run --frozen python packages/com.veilbreak.gui/Tools~/web/package.py
          uv run --frozen python packages/com.veilbreak.gui/Tools~/handbook/build_handbook.py packages/com.veilbreak.gui "$RUNNER_TEMP/github-pages"
          git diff --exit-code -- packages/com.veilbreak.gui/Web~/dist packages/com.veilbreak.gui/Runtime/Styles/Tokens.uss packages/com.veilbreak.gui/Runtime/Core/VbTokens.cs
          if ! diff -qr --exclude='*.meta' packages/com.veilbreak.gui/docs "$RUNNER_TEMP/github-pages"; then
            # Show what differs: the handbook is minified, so split tags onto lines before diffing.
            diff -qr --exclude='*.meta' packages/com.veilbreak.gui/docs "$RUNNER_TEMP/github-pages" | awk '/^Files /{print $2" "$4}' |
              while read -r committed built; do diff <(tr '>' '\n' < "$committed") <(tr '>' '\n' < "$built") | cut -c1-400 | head -40; done
            exit 1
          fi

      - name: Install browser checks
        run: |
          npm ci --prefix packages/com.veilbreak.gui/Tools~/browser --ignore-scripts
          packages/com.veilbreak.gui/Tools~/browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Check mobile, inspector and motion interactions
        run: node packages/com.veilbreak.gui/Tools~/browser/run.cjs "$RUNNER_TEMP/github-pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/github-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
