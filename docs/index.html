<style>
/* Layout: sticky top bar · tier sidebar · one entry at a time in the main column (preview beside its facts on wide screens). */
:root {
  --hb-bg: #08050c; --hb-surface: #120c19; --hb-surface-2: #1a1324; --hb-surface-3: #241a31;
  --hb-line: rgba(250, 238, 244, .10); --hb-line-2: rgba(250, 238, 244, .18);
  --hb-ink: #faeef4; --hb-ink-2: rgba(250, 238, 244, .74); --hb-ink-3: rgba(250, 238, 244, .55);
  --hb-teal: #1dd9a0; --hb-teal-ink: #8ff0cf; --hb-amber: #ffc35a; --hb-lav: #c084fc; --hb-lav-ink: #d9b8ff; --hb-pink: #f39bc6;
  --hb-display: 'TeX Gyre Adventor', 'Century Gothic', 'Avenir Next', sans-serif;
  --hb-body: Poppins, 'Avenir Next', system-ui, sans-serif;
  --hb-mono: 'Share Tech Mono', ui-monospace, Menlo, monospace;
  --hb-cut: 4px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--hb-bg); color: var(--hb-ink); }
body { margin: 0; font: 400 14px/1.6 var(--hb-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hb-bg); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hb-teal-ink); outline-offset: 2px; }
code, pre { font-family: var(--hb-mono); }
.slim { clip-path: polygon(var(--hb-cut) 0, 100% 0, 100% calc(100% - var(--hb-cut)), calc(100% - var(--hb-cut)) 100%, 0 100%, 0 var(--hb-cut)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(8, 5, 12, .94); border-bottom: 1px solid var(--hb-line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar__in { display: flex; align-items: center; gap: 14px; min-height: 56px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; white-space: nowrap; }
.brand b { font: 700 15px/1 var(--hb-display); letter-spacing: .28em; }
.brand b i { font-style: normal; color: var(--hb-ink-3); letter-spacing: .1em; }
.brand span { font: 700 10px/1 var(--hb-body); letter-spacing: .2em; color: var(--hb-teal-ink); }
.menu-btn { display: none; background: var(--hb-surface-2); border: 0; padding: 8px 12px; font: 700 11px/1 var(--hb-body); letter-spacing: .14em; cursor: pointer; }
.search { flex: 1 1 220px; min-width: 0; max-width: 360px; }
.search input { width: 100%; background: var(--hb-surface-2); border: 1px solid transparent; color: var(--hb-ink); font: 400 13px/1 var(--hb-body); padding: 10px 12px; }
.search input:focus { outline: none; border-color: var(--hb-teal); }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tog { display: inline-flex; align-items: center; gap: 8px; background: var(--hb-surface-2); border: 0; padding: 8px 10px; font: 700 10px/1 var(--hb-body); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; color: var(--hb-ink-2); }
.tog i { width: 22px; height: 12px; background: var(--hb-surface-3); position: relative; flex: none; }
.tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 8px; height: 8px; background: var(--hb-ink-3); transition: left .2s; }
.tog[aria-pressed="true"] { color: var(--hb-ink); }
.tog[aria-pressed="true"] i { background: var(--hb-teal); }
.tog[aria-pressed="true"] i::after { left: 12px; background: #0e0914; }

/* frame */
.frame { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: calc(100vh - 57px); }
nav.side { border-right: 1px solid var(--hb-line); padding: 18px 12px 40px max(16px, env(safe-area-inset-left, 0px)); position: sticky; top: calc(57px + env(safe-area-inset-top, 0px)); height: calc(100vh - 57px - env(safe-area-inset-top, 0px)); overflow-y: auto; }
.side h3 { font: 700 10px/1 var(--hb-body); letter-spacing: .2em; color: var(--hb-ink-3); margin: 18px 8px 8px; display: flex; justify-content: space-between; }
.side h3:first-child { margin-top: 0; }
.side a { display: flex; align-items: center; gap: 8px; padding: 5px 8px; text-decoration: none; color: var(--hb-ink-2); font-size: 13px; line-height: 1.35; }
.side a:hover { background: var(--hb-surface); color: var(--hb-ink); }
.side a[aria-current="page"] { background: var(--hb-surface-2); color: var(--hb-ink); }
.side a small { margin-left: auto; font: 400 11px/1 var(--hb-mono); color: var(--hb-ink-3); }
.dot { width: 7px; height: 7px; flex: none; }
.dot--shipped { background: var(--hb-teal); }
.dot--partial { background: var(--hb-amber); transform: rotate(45deg); width: 6px; height: 6px; }
.dot--proposed { border: 1.5px solid var(--hb-lav); }
main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, 3vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 3vw); }
.wrap { max-width: 1180px; }

/* type */
.eyebrow { font: 700 11px/1 var(--hb-body); letter-spacing: .2em; color: var(--hb-ink-3); text-transform: uppercase; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h1 { font: 700 clamp(26px, 4vw, 38px)/1.1 var(--hb-display); letter-spacing: .06em; margin: 10px 0 8px; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font: 700 13px/1 var(--hb-body); letter-spacing: .2em; text-transform: uppercase; color: var(--hb-ink-2); margin: 36px 0 12px; }
h4 { font: 700 12px/1.3 var(--hb-body); letter-spacing: .1em; text-transform: uppercase; color: var(--hb-ink-2); margin: 18px 0 6px; }
.lede { font-size: 16px; color: var(--hb-ink-2); max-width: 68ch; margin: 0 0 14px; text-wrap: pretty; }
.prose { max-width: 76ch; color: var(--hb-ink-2); }
.prose p, .prose li { color: var(--hb-ink-2); }
.prose strong { color: var(--hb-ink); }
.prose ul { padding-left: 18px; margin: 6px 0; }
.prose li { margin: 4px 0; }
.prose code, .lede code, td code, .chip code { font-size: .92em; background: var(--hb-surface-2); padding: 1px 5px; color: var(--hb-teal-ink); }
.prose .ref { color: var(--hb-ink); border-bottom: 1px dotted var(--hb-ink-3); }

/* pills, chips */
.pill { display: inline-flex; align-items: center; gap: 7px; font: 700 10px/1 var(--hb-body); letter-spacing: .14em; text-transform: uppercase; padding: 6px 9px; background: var(--hb-surface-2); }
.pill--shipped { color: var(--hb-teal-ink); } .pill--partial { color: var(--hb-amber); } .pill--proposed { color: var(--hb-lav-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; background: var(--hb-surface-2); font: 500 12px/1.2 var(--hb-body); color: var(--hb-ink-2); text-decoration: none; }
a.chip:hover { background: var(--hb-surface-3); color: var(--hb-ink); }
.chip--code { font: 400 12.5px/1.2 var(--hb-mono); color: var(--hb-teal-ink); }

/* entry */
.entry-head { display: grid; gap: 4px; margin-bottom: 18px; }
.entry-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 320px); gap: 18px; align-items: start; }
.stage { background: var(--hb-surface); padding: 0; min-width: 0; }
.stage__bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; font: 700 10px/1 var(--hb-body); letter-spacing: .16em; color: var(--hb-ink-3); text-transform: uppercase; border-bottom: 1px solid var(--hb-line); flex-wrap: wrap; }
.stage__bar button { background: none; border: 0; cursor: pointer; font: inherit; letter-spacing: inherit; color: var(--hb-teal-ink); padding: 2px 0; }
.stage__body { overflow: auto; display: flex; justify-content: center; }
.stage__body--free { justify-content: flex-start; }
.stage__body > .hb-free { width: 100%; min-height: 120px; }
.phone-hold { position: relative; margin: 18px auto; flex: none; }
.phone-hold > .hb-scale { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.facts { display: grid; gap: 12px; }
.fact { background: var(--hb-surface); padding: 12px 14px; }
.fact h5 { margin: 0 0 8px; font: 700 10px/1 var(--hb-body); letter-spacing: .18em; color: var(--hb-ink-3); text-transform: uppercase; }
.fact p { margin: 0; color: var(--hb-ink-3); font-size: 12.5px; }
.swatches { display: grid; gap: 4px; }
.sw { display: flex; align-items: center; gap: 8px; font: 400 12px/1.2 var(--hb-mono); color: var(--hb-ink-2); min-width: 0; }
.sw i { width: 14px; height: 14px; flex: none; box-shadow: inset 0 0 0 1px rgba(250,238,244,.18); }
.sw span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tabs { display: flex; gap: 2px; margin: 26px 0 0; border-bottom: 1px solid var(--hb-line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; font: 700 11px/1 var(--hb-body); letter-spacing: .16em; text-transform: uppercase; color: var(--hb-ink-3); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--hb-ink); border-bottom-color: var(--hb-teal); }
.tab sup { font: 400 10px/1 var(--hb-mono); color: var(--hb-ink-3); margin-left: 4px; }
.panel { padding-top: 16px; }

/* code */
.codebox { position: relative; background: #0c0811; margin: 8px 0 14px; min-width: 0; }
.codebox__head { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; font: 700 10px/1 var(--hb-body); letter-spacing: .16em; color: var(--hb-ink-3); text-transform: uppercase; background: var(--hb-surface); }
.codebox__head button { background: none; border: 0; color: var(--hb-teal-ink); cursor: pointer; font: inherit; letter-spacing: inherit; }
pre.code, .codebox pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 400 12.5px/1.6 var(--hb-mono); color: #e9dcef; background: #0c0811; }
.prose pre.code { margin: 10px 0; }
.k { color: var(--hb-lav-ink); } .s { color: var(--hb-teal-ink); } .c { color: var(--hb-ink-3); } .t { color: var(--hb-amber); } .p { color: var(--hb-pink); }

/* uss */
.rule { padding: 6px 0; border-top: 1px solid var(--hb-line); font: 400 12.5px/1.55 var(--hb-mono); min-width: 0; }
.rule:first-child { border-top: 0; }
.rule b { color: var(--hb-teal-ink); font-weight: 400; overflow-wrap: anywhere; }
.rule em { font-style: normal; color: var(--hb-ink-3); float: right; margin-left: 8px; }
.rule div { color: var(--hb-ink-2); padding-left: 14px; overflow-wrap: anywhere; }

/* tables */
.tablewrap { overflow-x: auto; margin: 8px 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font: 700 10px/1.2 var(--hb-body); letter-spacing: .16em; color: var(--hb-ink-3); text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--hb-line-2); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--hb-line); vertical-align: top; color: var(--hb-ink-2); }
td.mono, .mono { font-family: var(--hb-mono); font-size: 12.5px; color: var(--hb-ink); white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--hb-surface); }

/* overview */
.tiers { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.tier { background: var(--hb-surface); padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.tier__n { font: 400 34px/1 var(--hb-mono); color: var(--hb-ink); }
.tier__name { font: 700 12px/1 var(--hb-body); letter-spacing: .2em; text-transform: uppercase; }
.tier p { margin: 0; font-size: 12.5px; color: var(--hb-ink-3); line-height: 1.5; }
.tier__list { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
.tier__list a { display: flex; gap: 7px; align-items: center; font-size: 12.5px; text-decoration: none; color: var(--hb-ink-2); padding: 3px 0; overflow: hidden; }
.tier__list a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tier__list a:hover { color: var(--hb-ink); }
.statusbar { display: flex; height: 6px; margin-top: auto; }
.statusbar i { display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--hb-ink-3); margin: 12px 0 0; }
.legend span { display: inline-flex; gap: 7px; align-items: center; }
.callout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; background: var(--hb-surface); padding: 18px; margin-top: 12px; align-items: center; }
.callout h3 { font: 700 18px/1.2 var(--hb-display); letter-spacing: .08em; margin: 0 0 8px; }
.callout p { color: var(--hb-ink-2); margin: 0 0 10px; }
.go { display: inline-flex; gap: 8px; align-items: center; font: 700 11px/1 var(--hb-body); letter-spacing: .16em; text-transform: uppercase; color: var(--hb-teal-ink); text-decoration: none; }
.steps { counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.step { background: var(--hb-surface); padding: 14px; counter-increment: s; min-width: 0; }
.step::before { content: counter(s, decimal-leading-zero); display: block; font: 400 12px/1 var(--hb-mono); color: var(--hb-teal-ink); margin-bottom: 8px; }
.step b { display: block; font-size: 13px; margin-bottom: 4px; }
.step p { margin: 0; font-size: 12.5px; color: var(--hb-ink-3); }
.step code { font-size: 11.5px; color: var(--hb-teal-ink); overflow-wrap: anywhere; }

/* icons */
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px; }
.ic { background: var(--hb-surface); border: 0; padding: 14px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; min-width: 0; color: var(--hb-ink); }
.ic:hover { background: var(--hb-surface-2); }
.ic .vb-icon { color: var(--hb-ink); }
.ic span { font: 400 11px/1.2 var(--hb-mono); color: var(--hb-ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ic small { font: 400 10px/1 var(--hb-mono); color: var(--hb-lav-ink); }
.fams { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px; }
.fam { background: var(--hb-surface-2); border: 0; padding: 6px 10px; font: 700 10px/1 var(--hb-body); letter-spacing: .14em; text-transform: uppercase; color: var(--hb-ink-3); cursor: pointer; }
.fam[aria-pressed="true"] { background: var(--hb-teal); color: #0e0914; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--hb-surface-3); padding: 10px 14px; font: 400 12.5px/1.3 var(--hb-mono); z-index: 40; max-width: calc(100vw - 32px); }

/* type specimens */
.spec-row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-top: 1px solid var(--hb-line); align-items: baseline; }
.spec-row .meta { font: 400 12px/1.5 var(--hb-mono); color: var(--hb-ink-3); }
.spec-row .meta b { color: var(--hb-ink); font-weight: 400; display: block; }
.spec-row .sample { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

@media (max-width: 1100px) { .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); } .entry-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  nav.side { display: none; position: fixed; inset: calc(57px + env(safe-area-inset-top, 0px)) 0 0 0; height: auto; z-index: 15; background: var(--hb-bg); border-right: 0; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body.nav-open nav.side { display: block; }
  .menu-btn { display: inline-block; }
  .callout { grid-template-columns: minmax(0, 1fr); }
  .spec-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}
@media (max-width: 520px) { .tiers { grid-template-columns: minmax(0, 1fr); } .toggles { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

abelSize size=LabelSize.Label,TextTone tone=TextTone.Default):base(text,size==LabelSize.Badge?TypeStyle.Badge:TypeStyle.Label,tone)"]}, {"type": "LabelSize", "kind": "enum", "base": "", "file": "Runtime/Controls/Text.cs", "summary": "The caps eyebrow sizes.", "members": ["enum LabelSize { Label, Badge }"]}]}, {"id": "glitch-text", "tier": "atom", "name": "GlitchTextComponent", "unity": ["GlitchText", "Glitch.In/Out/Pulse/Slam"], "status": "shipped", "summary": "A Label that projects in and out with clipped red/cyan bands. Headlines and announcements only.", "uses": ["text"], "usedBy": ["holo-frame", "route-view", "battle-hud-view"], "blocks": ["vb-glitch"], "stage": "free", "height": 140, "hasPreview": true, "csharp": "var title = new GlitchText { text = \"CHOOSE YOUR ROAD\" }.Classes(\"vb-t-display\").Into(page);\nGlitch.In(title);            // falls back to a fade under vb-reduced-motion / vb-reduced-flashes", "uxml": "", "rules": "<ul><li>One projected headline per screen. Body copy never glitches.<\/li><li>Schedules cancel on replacement and detach; you never have to clean up.<\/li><\/ul>", "spec": "", "doc": "<div class=\"tablewrap\"><table><thead><tr><th>Component<\/th><th>Input<\/th><th>Events / behaviour<\/th><\/tr><\/thead><tbody><tr><td><code>GlitchText<\/code><\/td><td>Ordinary label <code>text<\/code> and USS typography<\/td><td>Eight clipped bands, red/cyan channels. <code>Glitch.In/Out/Pulse/Slam<\/code>; schedules cancel on replacement/detach.<\/td><\/tr><tr><td><code>Announcer<\/code><\/td><td><code>Say(text, alert, milliseconds, interrupt)<\/code><\/td><td>Bounded six-notice queue; critical pre-emption; out before replacement, in then hold then out. Dispose with its host.<\/td><\/tr><tr><td><code>RouteChoice<\/code><\/td><td><code>RouteView<\/code> with wave and two <code>RoadView<\/code> signs<\/td><td><code>Chosen(side)<\/code> once, left 0 / right 1. Full signs exceed 44 units; keyboard Enter/Space. <code>Choose<\/code> supports alternate input.<\/td><\/tr><tr><td><code>MerchantScreen<\/code><\/td><td><code>MerchantView<\/code> with credits, offers, sellable stacks and HP consequences<\/td><td><code>Bought(index)<\/code>, <code>PerkSold(id)<\/code>, <code>HealthSold(actor)<\/code>, <code>Left<\/code>. Host validates and rebinds after each transaction. <code>ScrollOffset<\/code> preserves position.<\/td><\/tr><tr><td><code>CreditsChip<\/code><\/td><td><code>Set(credits)<\/code><\/td><td>Currency icon and integer; formats on change.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>PerkTier.Rare<\/code> is cyan; <code>Epic<\/code> is violet with a short shimmer. Both have explicit text labels. Merchant offer states say why a purchase is blocked (credits, sold, stack cap). Health rows state the before/after HP; fighters that cannot retain 1 HP cannot trade. Instant rewards are excluded from sellable stacks by the host. <code>HudTop<\/code> places pause and icon-only autoplay at the top left. Autoplay retains its state tint and tooltip, speed stays on the right, credits sit beside Power. <code>WaveSlammed<\/code> lets the host request its own bounded camera jolt; the GUI has no dependency on a camera or arcade simulation. The host must use actual safe-area insets, with a small battle fallback.<\/p>", "docTitle": "Projection and the road economy", "uss": [{"file": "Gui.uss", "sel": ".vb-glitch", "body": "overflow: visible;"}, {"file": "Gui.uss", "sel": ".vb-glitch__copy", "body": "position: absolute; left: 0; top: 0; right: 0; bottom: 0; margin: 0; border-width: 0; background-color: rgba(0,0,0,0); white-space: normal;"}, {"file": "Gui.uss", "sel": ".vb-glitch__red", "body": "color: var(--vb-color-glitch-red);"}, {"file": "Gui.uss", "sel": ".vb-glitch__cyan", "body": "color: var(--vb-color-glitch-cyan);"}, {"file": "Gui.uss", "sel": ".vb-glitch__clip", "body": "position: absolute; left: 0; overflow: hidden;"}, {"file": "Gui.uss", "sel": ".vb-glitch__slice", "body": "color: var(--vb-color-text);"}, {"file": "Gui.uss x; -unity-background-image-tint-color: var(--vb-color-glitch-cyan);"}, {"file": "Gui.uss", "sel": ".vb-hud__auto .vb-icon, .vb-compact .vb-hud__auto .vb-icon", "body": "display: flex; margin: 0;"}], "tokens": ["--vb-color-ally-text", "--vb-color-enemy-text", "--vb-color-glitch-cyan", "--vb-color-line-strong", "--vb-color-on-cta", "--vb-color-panel", "--vb-color-power-text", "--vb-color-text", "--vb-color-text-2", "--vb-color-text-3", "--vb-font-body-medium"], "api": [{"type": "VbIcon", "kind": "class", "base": "VisualElement", "file": "Runtime/Controls/Basics.cs", "summary": "A 24-grid stroke glyph from the Veilbreak icon set, chosen by name (Icons.uss maps vb-icon--{kebab-name} to its SVG).", "members": ["const string ClassName=\"vb-icon\"", "[UxmlAttribute] string Icon", "VbIcon():this(\"add\")", "VbIcon(string icon,float size=16)", "VbIcon Size(float px)", "VbIcon Tint(Color c)"]}]}, {"id": "mark", "tier": "atom", "name": "MarkComponent", "unity": ["VbMark", "MarkGeometry"], "status": "shipped", "summary": "The slash-cut VEIL/BREAK mark at a width; its height follows the 513 × 259 artwork.", "uses": [], "usedBy": ["main-menu"], "blocks": ["vb-mark"], "stage": "free", "height": 220, "hasPreview": true, "csharp": "new VbMark(240).Into(brand);   // MarkGeometry.Parts drives the splash too", "uxml": "", "rules": "<ul><li>The mark appears once per screen at most, on the main menu and the splash.<\/li><\/ul>", "spec": "", "doc": "<p>The slash-cut VEIL/BREAK mark.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new VbMark(260)<\/code>. Its height follows the 513 × 259 artwork.<\/li><li><strong>USS:<\/strong> <code>vb-mark<\/code>.<\/li><\/ul>", "docTitle": "VbMark", "uss": [{"file": "Gui.uss", "sel": ".vb-mark", "body": "background-image: url(\"../Vectors/Mark.svg\"); -unity-background-scale-mode: scale-to-fit; flex-shrink: 0;"}], "tokens": [], "api": [{"type": "VbMark", "kind": "class", "base": "VisualElement", "file": "Runtime/Controls/Basics.cs", "summary": "The slash-cut VEIL/BREAK mark at a given width.", "members": ["const string ClassName=\"vb-mark\"", "[UxmlAttribute] float Width", "VbMark():this(260)", "VbMark(float width)"]}, {"type": "MarkGeometry", "kind": "class", "base": "", "file": "Runtime/Core/MarkGeometry.cs", "summary": "The Veilbreak mark as separate parts in logo units (the design's 640 × 686 artboard): each letter of VEILBREAK and the four slices of the blade, with absolute M/L/C/Z path data. VbMark draws the composed mark from Vectors/Mark.svg; animated renderers (the intro splash) move the parts independently and fill Rings.", "members": ["static readonly IReadOnlyList<(string id,bool blade,string d)> Parts=new (string,bool,string)[]", "fill them even-odd.<\/summary> static Vector2[][] Rings(string d)"]}]}, {"id": "frame", "tier": "atom", "name": "FrameComponent", "unity": ["VbShape", "VbFrame", "FrameKind", "Ui.Frame", "vb-panel"], "status": "shipped", "summary": "The surface everything sits on. Two kinds: slim (the default container) and chipped (things you act on or that are selected).", "uses": [], "usedBy": ["button", "badge", "toggle-input", "choice-input", "popover", "backdrop", "list-row", "tile", "card", "icon-button", "drawer", "fieldset", "score-row", "perk-row", "dialog", "holo-frame", "holo-platform", "rule-row"], "blocks": ["vb-shape", "vb-panel", "vb-frame"], "stage": "free", "height": 420, "hasPreview": true, "csharp": "var box = Ui.Frame(parent, FrameKind.Slim);                       // vb-panel vb-frame--slim: sections, sheets, rows, cards\nvar tint = Ui.Frame(parent, FrameKind.Slim, \"vb-frame--ally\");     // ally-soft fill\nvar link = Ui.Frame(parent, FrameKind.Chipped);                    // cut + hairline: what you act on", "uxml": "<vb:VbFrame class=\"vb-panel\" kind=\"Slim\" />\n<vb:VbFrame class=\"vb-panel vb-frame--raised\" kind=\"Slim\" />\n<vb:VbFrame class=\"vb-panel\" kind=\"Chipped\" />", "rules": "<ul><li><strong>Slim<\/strong> (cut-xs 4, no edge, fill only) for every container: sections, dialog sheets, list rows, cards, badges.<\/li><li><strong>Chipped<\/strong> (cut 6–14, hairline edge) only where the frame means something: buttons, tiles you pick, the selected thing, holo frames, focus.<\/li><li>Never nest chipped in chipped. A chipped control inside a slim container is the normal case.<\/li><li>Slim frames get their edge back under <code>vb-contrast<\/code> so containers still separate at 3:1. Selected and warning states keep their edge.<\/li><li>Fills come from tokens: <code>panel<\/code>, <code>panel-solid<\/code>, <code>raised<\/code>, and the <code>*-soft<\/code> tints behind their own text colour.<\/li><\/ul>", "spec": "<p>Slim is the default container since 0.3.0. <code>VbShape<\/code> reads <code>--vb-cut<\/code> and <code>--vb-bw<\/code>, so a kind is <strong>pure USS<\/strong>; <code>FrameKind<\/code> and <code>Ui.Frame<\/code> only pick the class:<\/p>\n<pre class=\"code\"><code>/* Gui.uss — FrameComponent kinds. VbShape reads both from the same properties: no C# change. */\n/* Slim: the default container. Small chamfer (cut-xs), no edge, fill only. */\n.vb-frame--slim { --vb-cut: 4; --vb-bw: 0; --vb-fill: var(--vb-color-panel); }\n.vb-frame--slim.vb-frame--raised { --vb-fill: var(--vb-color-raised); }\n.vb-frame--slim.vb-frame--solid { --vb-fill: var(--vb-color-panel-solid); }\n.vb-frame--slim.vb-frame--ally { --vb-fill: var(--vb-color-ally-soft); }\n.vb-frame--slim.vb-frame--enemy { --vb-fill: var(--vb-color-enemy-soft); }\n.vb-frame--slim.vb-frame--power { --vb-fill: var(--vb-color-power-soft); }\n/* Chipped: the cut + hairline look, kept for what you act on or what is selected. */\n.vb-frame--chipped { --vb-cut: 10; --vb-bw: 1; --vb-edge: var(--vb-color-line); }\n/* High contrast: a container with no edge must still separate from the world at 3:1. */\n.vb-contrast .vb-frame--slim { --vb-bw: 1; --vb-edge: var(--vb-color-line-strong); }<\/code><\/pre>\n<p>The package's own containers moved to the slim kind with no markup change (<code>Layout.uss<\/code>):<\/p>\n<pre class=\"code\"><code>/* Layout.uss — the package&#x27;s containers on the slim kind (same selectors, no markup change). */\n.vb-section, .vb-dialog, .vb-details, .vb-score, .vb-perk-row, .vb-rule, .vb-result, .vb-queue__row, .vb-merchant__exchange { --vb-cut: 4; --vb-bw: 0; }\n/* States that are selections or warnings keep an edge. */\n.vb-score--current, .vb-perk-row--selected, .vb-rule--warning, .vb-rule--draft, .vb-queue__row--next, .vb-queue__row--manual { --vb-bw: 1; }\n.vb-contrast .vb-section, .vb-contrast .vb-dialog, .vb-contrast .vb-details, .vb-contrast .vb-score, .vb-contrast .vb-perk-row,\n.vb-contrast .vb-rule, .vb-contrast .vb-result, .vb-contrast .vb-queue__row, .vb-contrast .vb-merchant__exchange { --vb-bw: 1; --vb-edge: var(--vb-color-line-strong); }<\/code><\/pre>", "doc": "<p>The Veil cut shape: top-left and bottom-right chamfers, painted as a mesh because UI Toolkit has no <code>clip-path<\/code>.<\/p>\n<ul><li><strong>API:<\/strong> <code>VbShape.Attach(element)<\/code> returns the element. Attaching twice is a no-op.<\/li><li><strong>USS:<\/strong> reads these properties:<\/li><\/ul>\n<p>  | Property | Meaning |   | --- | --- |   | <code>--vb-cut<\/code> | Chamfer size in units |   | <code>--vb-fill<\/code>, <code>--vb-fill-to<\/code>, <code>--vb-fill-dir<\/code> | Fill colour, optional gradient end, and its direction in degrees (0 = left → right) |   | <code>--vb-edge<\/code>, <code>--vb-edge-to<\/code> | Edge colour and optional gradient end |   | <code>--vb-bw<\/code> | Edge width |   | <code>--vb-dash<\/code> | <code>1<\/code> draws a square dashed frame |   | <code>--vb-bracket<\/code>, <code>--vb-bracket-len<\/code> | L marks on the two square corners |   | <code>--vb-glow<\/code> | Soft outer bleed |<\/p>\n<p>  <code>.vb-shape<\/code> resets them all, because custom properties inherit.<\/p>\n<ul><li><strong>Notes:<\/strong> the content box and hit area stay the element's rectangle. Token colours work directly: <code>--vb-edge: var(--vb-color-ally)<\/code>.<\/li><\/ul>", "docTitle": "VbShape", "uss": [{"file": "Gui.uss", "sel": ".vb-shape", "body": "--vb-cut: 10; --vb-bw: 1; --vb-fill-dir: 0; --vb-dash: 0; --vb-bracket-len: 8; --vb-fill: rgba(0, 0, 0, 0); --vb-fill-to: rgba(0, 0, 0, 0); --vb-edge: rgba(0, 0, 0, 0); --vb-edge-to: rgba(0, 0, 0, 0); --vb-bracket: rgba(0, 0, 0, 0); --vb-glow: rgba(0, 0, 0, 0); background-color: rgba(0, 0, 0, 0); border-width: 0; border-radius: 0;"}, {"file": "Gui.uss", "sel": ".vb-contrast .vb-shape, .vb-reduced-flashes .vb-shape", "body": "--vb-glow: rgba(0, 0, 0, 0);"}, {"file": "Gui.uss", "sel": ".vb-panel", "body": "padding: var(--vb-space-4); --vb-fill: var(--vb-color-panel); --vb-edge: var(--vb-color-line);"}, {"file": "Gui.uss", "sel": ".vb-panel--solid", "body": "--vb-fill: var(--vb-color-panel-solid); --vb-edge: var(--vb-color-line-strong); --vb-cut: 14;"}, {"file": "Gui.uss", "sel": ".vb-panel--raised", "body": "--vb-fill: var(--vb-color-raised); --vb-edge: var(--vb-color-line-strong);"}, {"file": "Gui.uss", "sel": ".vb-panel--glass", "body": "--vb-fill: rgba(14, 9, 20, 0.40); --vb-edge: rgba(250, 238, 244, 0.10);"}, {"file": "Gui.uss", "sel": ".vb-panel--enemy", "body": "--vb-fill: rgba(14, 9, 20, 0.65); --vb-edge: rgba(240, 80, 154, 0.60);"}, {"file": "Gui.uss", "sel": ".vb-panel--ally", "body": "--vb-fill: rgba(16, 38, 40, 0.86); --vb-edge: rgba(29, 217, 160, 0.60);"}, {"file": "Gui.uss", "sel": ".vb-panel--power", "body": "--vb-fill: rgba(30, 18, 44, 0.86); --vb-edge: rgba(192, 132, 252, 0.60);"}, {"file": "Gui.uss", "sel": ".vb-panel--brackets", "body": "--vb-bracket: var(--vb-color-ally);"}, {"file": "Gui.uss", "sel": ".vb-panel__head", "body": "flex-direction: row; justify-content: space-between; align-items: flex-end; margin-bottom: 8px;"}, {"file": "Gui.uss", "sel": ".vb-panel__title", "body": "-unity-font-definition: var(--vb-font-body-bold); font-size: 10px; letter-spacing: 14px; color: var(--vb-color-text-2);"}, {"file": "Gui.uss", "sel": ".vb-panel--ally .vb-panel__title", "body": "color: var(--vb-color-ally-text);"}, {"file": "Gui.uss", "sel": ".vb-panel--enemy .vb-panel__title", "body": "color: var(--vb-color-enemy-text);"}, {"file": "Gui.uss", "sel": ".vb-panel--power .vb-panel__title", "body": "color: var(--vb-color-power-text);"}, {"file": "Gui.uss", "sel": ".vb-panel__meta", "body": "font-size: 10px; color: var(--vb-color-text-3);"}, {"file": "Gui.uss", "sel": ".vb-frame--slim", "body": "--vb-cut: 4; --vb-bw: 0; --vb-fill: var(--vb-color-panel);"}, {"file": "Gui.uss", "sel": ".vb-frame--slim.vb-frame--raised", "body": "--vb-fill: var(--vb-color-raised);"}, {"file": "Gui.uss", "sel": ".vb-frame--slim.vb-frame--solid", "body": "--vb-fill: var(--vb-color-panel-solid);"}, {"file": "Gui.uss", "sel": ".vb-frame--slim.vb-frame--ally", "body": "--vb-fill: var(--vb-color-ally-soft);"}, {"file": "Gui.uss", "sel": ".vb-frame--slim.vb-frame--enemy", "body": "--vb-fill: var(--vb-color-enemy-soft);"}, {"file": "Gui.uss", "sel": ".vb-frame--slim.vb-frame--power", "body": "--vb-fill: var(--vb-color-power-soft);"}, {"file": "Gui.uss", "sel": ".vb-frame--chipped", "body": "--vb-cut: 10; --vb-bw: 1; --vb-edge: var(--vb-color-line);"}, {"file": "Gui.uss", "sel": ".vb-contrast .vb-frame--slim", "body": "--vb-bw: 1; --vb-edge: var(--vb-color-line-strong);"}], "tokens": ["--vb-color-ally", "--vb-color-ally-soft", "--vb-color-ally-text", "--vb-color-enemy-soft", "--vb-color-enemy-text", "--vb-color-line", "--vb-color-line-strong", "--vb-color-panel", "--vb-color-panel-solid", "--vb-color-power-soft", "--vb-color-power-text", "--vb-color-raised", "--vb-color-text-2", "--vb-color-text-3", "--vb-font-body-bold", "--vb-space-4"], "api": [{"type": "VbShape", "kind": "class", "base": "", "file": "Runtime/Core/VbShape.cs", "summary": "The Veil cut shape: top-left and bottom-right chamfers, painted as a mesh because UI Toolkit has no clip-path. Every value comes from USS custom properties, so stylesheets own the look: --vb-cut (px) --vb-fill [--vb-fill-to --vb-fill-dir (deg, 0 = left→right)] --vb-edge [--vb-edge-to] --vb-bw (px) --vb-dash (1: square dashed frame, the \"blocked/queued\" look) --vb-bracket [--vb-bracket-len] (L marks on the square corners) --vb-glow (soft outer bleed, the glow budget's CTA/selected look). Content box and hit area stay the element's rectangle. .vb-shape resets every property in Gui.uss because custom properties inherit.", "members": ["const string ClassName=\"vb-shape\"", "/// <summary>Paints <paramref name=\"element\"/> as a cut shape from its stylesheet and returns it.<\/summary> static T Attach<T>(T element) where T:VisualElement", "/// <summary>The chamfered outline of a <paramref name=\"w\"/>×<paramref name=\"h\"/> shape, moved inward by <paramref name=\"inset\"/> (negative grows it).<\/summary> static Vector2[] Outline(float w,float h,float cut,float in"]}, {"type": "VbFrame", "kind": "class", "base": "VisualElement", "file": "Runtime/Core/VbShape.cs", "summary": "A cut-corner panel for UXML: <Veilbreak.Gui.VbFrame class=\"vb-panel\" kind=\"Slim\"/>.", "members": ["[UxmlAttribute] FrameKind Kind", "VbFrame()", "VbFrame(FrameKind kind):this()"]}, {"type": "FrameKind", "kind": "enum", "base": "", "file": "Runtime/Core/VbShape.cs", "summary": "The two container looks: slim (cut-xs, no edge; the default for sections, sheets, rows and cards) and chipped (cut + hairline; for what you act on or what is selected). Custom leaves the frame to its own classes.", "members": ["enum FrameKind { Custom, Slim, Chipped }"]}]}, {"id": "button", "tier": "atom", "name": "ButtonComponent", "unity": ["VbButton", "ButtonVariant"], "status": "shipped", "summary": "A chipped button: primary (one per screen), secondary, light, danger, ghost. Blocked buttons say why.", "uses": ["frame", "text", "icon"], "usedBy": ["list-row", "button-with-icon", "drawer", "form", "skill-button", "operative-details", "dialog", "main-menu", "menu-actions", "s Slim:<\/strong> the popover body should use <code>vb-frame--slim vb-frame--solid<\/code> instead of today's chipped solid panel.<\/p>", "doc": "<p>Hover, focus and tap popovers. Content is built on demand and placed on the panel root, so it is never clipped, and clamped inside the panel's edges.<\/p>\n<ul><li><strong>Build:<\/strong> <code>Popover.Attach(anchor, () =&gt; content, PopoverPlacement.Below | Above, alignEnd)<\/code>.<\/li><li><strong>API:<\/strong><\/li><ul><li><code>Open()<\/code>, <code>Close()<\/code>, <code>IsOpen<\/code>.<\/li><li><code>Pin()<\/code> keeps it open (galleries, tutorials, captures).<\/li><li><code>Popover.CloseAll()<\/code> returns whether any were open.<\/li><\/ul><li><strong>States:<\/strong> the anchor carries <code>vb-popover-open<\/code>. The content is wrapped in a <code>ScrollView<\/code> with <code>vb-popover<\/code>.<\/li><li><strong>Access:<\/strong> a mouse opens it on hover. Touch toggles it on tap. Focus opens it and blur closes it. It copies the anchor's root flags (<code>SafeAreaRoot.RootClasses<\/code>), so contrast, larger text and the motion settings reach it.<\/li><li><strong>Notes:<\/strong> only theme sheets reach the panel root. Keep the kit in the theme (<code>VeilbreakGui.tss<\/code>).<\/li><\/ul>", "docTitle": "Popover", "uss": [{"file": "Gui.uss", "sel": ".vb-popover", "body": "position: absolute;"}, {"file": "Gui.uss", "sel": ".vb-result:hover, .vb-result.vb-popover-open", "body": "--vb-fill: var(--vb-color-raised); --vb-edge: var(--vb-color-line-strong);"}, {"file": "Gui.uss", "sel": ".vb-perk-chip:hover, .vb-perk-chip.vb-popover-open", "body": "--vb-fill: var(--vb-color-ally-soft); --vb-edge: var(--vb-color-ally);"}, {"file": "Gui.uss", "sel": ".vb-hud__resources:hover, .vb-hud__resources.vb-popover-open", "body": "--vb-edge: rgba(192, 132, 252, 0.45);"}], "tokens": ["--vb-color-ally", "--vb-color-ally-soft", "--vb-color-line-strong", "--vb-color-raised"], "api": [{"type": "Popover", "kind": "class", "base": "", "file": "Runtime/Core/Popover.cs", "summary": "Hover/focus popovers that also work on touch: a pointer that cannot hover toggles on tap. Content is built on demand and placed on the panel's root (so it is never clipped), kept inside the panel's edges. Styles reach it through the panel theme, so put the kit's stylesheets in the theme (VeilbreakGui.tss), not only on a document. It copies the anchor's root flags (SafeAreaRoot.RootClasses), so high contrast, larger text and the motion settings reach it too.", "members": ["const string ClassName=\"vb-popover\",OpenClass=\"vb-popover-open\"", "static bool CloseAll()", "bool IsOpen", "static Popover Attach(VisualElement anchor,Func<VisualElement> build,PopoverPlacement placement=PopoverPlacement.Below,bool alignEnd=false)", "/// <summary>Keeps the popover open until <see cref=\"Close\"/> (galleries, tutorials, captures).<\/summary> void Pin()", "void Open()", "void Close()"]}]}, {"id": "overlay", "tier": "atom", "name": "OverlayComponent", "unity": ["ModalHost", "vb-modal", "Navigator.Push"], "status": "shipped", "summary": "A modal layer: dims and disables what is under it, takes focus, and returns focus when it closes.", "uses": [], "usedBy": ["drawer", "dialog", "sheet-layout", "pause-overlay", "guide-view"], "blocks": ["vb-modal", "vb-covered"], "stage": "board", "height": 220, "hasPreview": true, "csharp": "var layer = nav.Push(onClose: Resume);   // vb-modal, bottom-docked\nDialog.Sheet(layer, \"LEAVE GAME?\", \"Your profile is saved.\");\nnav.Back();                              // popover → modal → page back → fallback", "uxml": "", "rules": "<ul><li>Back order is fixed: popover, then modal, then the page's back, then the host fallback.<\/li><li>An overlay is never the only way out: Back always closes it.<\/li><\/ul>", "spec": "", "doc": "<p>Nested modal layers over a screen layer.<\/p>\n<ul><li><strong>API:<\/strong><\/li><ul><li><code>Push(content, onClose)<\/code> returns a <code>vb-modal<\/code> layer and covers <code>content<\/code> (<code>vb-covered<\/code>, disabled).<\/li><li><code>Pop()<\/code>, <code>Clear()<\/code>, <code>Count<\/code>.<\/li><\/ul><li><strong>Access:<\/strong> focus moves to the new layer and returns to the previously focused element when it closes. Opening a layer closes all popovers.<\/li><\/ul>", "docTitle": "ModalHost", "uss": [{"file": "Gui.uss", "sel": ".vb-modal--drawer", "body": "padding: 0; background-color: rgba(0, 0, 0, 0);"}, {"file": "Gui.uss", "sel": ".vb-modal", "body": "position: absolute; left: 0; right: 0; top: 0; bottom: 0; background-color: rgba(5,2,8,0.45); justify-content: flex-end; padding: 0 12px;"}, {"file": "Gui.uss", "sel": ".vb-covered", "body": "filter: blur(3px); opacity: 0.55;"}], "tokens": [], "api": [{"type": "ModalHost", "kind": "class", "base": "", "file": "Runtime/Core/ModalHost.cs", "summary": "Owns blockers, focus restoration and blur for nested modal layers.", "members": ["ModalHost(VisualElement root)", "int Count", "VisualElement Push(VisualElement content,Action onClose=null)", "bool Pop()", "void Clear()"]}]}, {"id": "backdrop", "tier": "atom", "name": "BackdropComponent", "unity": ["Backdrop"], "status": "shipped", "summary": "Full-bleed artwork behind a screen, scaled to cover, with a legibility shade along the bottom.", "uses": ["frame"], "usedBy": [], "blocks": ["vb-backdrop"], "stage": "free", "height": 260, "hasPreview": true, "csharp": "new Backdrop(menuArt).Into(screenLayer);", "uxml": "", "rules": "", "spec": "", "doc": "<p>Full-bleed artwork behind a screen, scaled to cover, with a gradient shade along the bottom.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new Backdrop(texture)<\/code>.<\/li><li><strong>USS:<\/strong> <code>vb-backdrop<\/code>, <code>__shade<\/code>.<\/li><\/ul>", "docTitle": "Backdrop", "uss": [{"file": "Layout.uss", "sel": ".vb-backdrop", "body": "position: absolute; left: 0; right: 0; top: 0; bottom: 0; -unity-background-scale-mode: scale-and-crop; -unity-background- ["badge", "icon", "text"], "usedBy": ["boss-bar", "operative-card"], "blocks": ["vb-status"], "stage": "free", "height": 90, "hasPreview": true, "csharp": "new StatusChip(StatusKind.Silenced, null, \"no skills\", \"1.4s\").Into(chips);", "uxml": "", "rules": "", "spec": "", "doc": "<p>A status with its own glyph and word.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new StatusChip(StatusKind.Silenced, text, detail, time)<\/code>. <code>StatusChip.Icon(kind)<\/code> gives the glyph name.<\/li><li><strong>View model:<\/strong> <code>StatusKind<\/code>: Exposed, Silenced, Rooted, Slowed, Interrupted, Barrier.<\/li><li><strong>States:<\/strong> <code>vb-status--{kind}<\/code>.<\/li><li><strong>USS:<\/strong> <code>__icon<\/code>, <code>__word<\/code>, <code>__detail<\/code>, <code>__time<\/code> (Share Tech Mono).<\/li><li><strong>Access:<\/strong> glyph and word together, so no two statuses read alike and none relies on colour.<\/li><\/ul>", "docTitle": "StatusChip", "uss": [{"file": "Gui.uss", "sel": ".vb-status", "body": "flex-direction: row; align-items: center; height: 22px; padding: 0 8px; margin-right: 6px; --vb-cut: 6; --vb-fill: var(--vb-color-raised); --vb-edge: var(--vb-color-line);"}, {"file": "Gui.uss", "sel": ".vb-status__icon", "body": "width: 14px; height: 14px; margin-right: 5px; -unity-background-image-tint-color: var(--vb-color-warn);"}, {"file": "Gui.uss", "sel": ".vb-status__word", "body": "-unity-font-definition: var(--vb-font-body-medium); -unity-font-style: bold; font-size: 10px; letter-spacing: 10.000px;"}, {"file": "Gui.uss", "sel": ".vb-status__detail", "body": "font-size: 10px; color: var(--vb-color-text-2); margin-left: 4px;"}, {"file": "Gui.uss", "sel": ".vb-status--barrier .vb-status__icon", "body": "-unity-background-image-tint-color: var(--vb-color-barrier);"}, {"file": "Gui.uss", "sel": ".vb-status--exposed", "body": "--vb-fill: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-status--exposed .vb-status__word, .vb-status--exposed .vb-status__detail", "body": "color: var(--vb-color-on-cta);"}, {"file": "Gui.uss", "sel": ".vb-status--exposed .vb-status__icon", "body": "-unity-background-image-tint-color: var(--vb-color-on-cta);"}, {"file": "Gui.uss", "sel": ".vb-status__time", "body": "margin-left: 5px; -unity-font-definition: var(--vb-font-hud-regular); font-size: 11px; color: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-status--exposed .vb-status__time", "body": "color: var(--vb-color-on-cta);"}], "tokens": ["--vb-color-barrier", "--vb-color-line", "--vb-color-on-cta", "--vb-color-raised", "--vb-color-text", "--vb-color-text-2", "--vb-color-warn", "--vb-font-body-medium", "--vb-font-hud-regular"], "api": [{"type": "StatusChip", "kind": "class", "base": "VisualElement", "file": "Runtime/Controls/Basics.cs", "summary": "A status with its own glyph and word, so no two statuses read alike and none relies on colour.", "members": ["const string ClassName=\"vb-status\"", "static string Icon(StatusKind kind)", "StatusChip(StatusKind kind,string text=null,string detail=null,string time=null)"]}]}, {"id": "credits-badge", "tier": "composite", "name": "CreditsBadgeComposite", "unity": ["CreditsChip"], "status": "shipped", "summary": "The currency glyph and an integer; formats on change.", "uses": ["badge", "icon"], "usedBy": ["hud-band", "merchant-view"], "blocks": ["vb-credits"], "stage": "free", "height": 100, "hasPreview": true, "csharp": "var credits = new CreditsChip().Into(power); credits.Set(run.Credits);", "uxml": "", "rules": "", "spec": "", "doc": "<div class=\"tablewrap\"><table><thead><tr><th>Component<\/th><th>Input<\/th><th>Events / behaviour<\/th><\/tr><\/thead><tbody><tr><td><code>GlitchText<\/code><\/td><td>Ordinary label <code>text<\/code> and USS typography<\/td><td>Eight clipped bands, red/cyan channels. <code>Glitch.In/Out/Pulse/Slam<\/code>; schedules cancel on replacement/detach.<\/td><\/tr><tr><td><code>Announcer<\/code><\/td><td><code>Say(text, alert, milliseconds, interrupt)<\/code><\/td><td>Bounded six-notice queue; critical pre-emption; out before replacement, in then hold then out. Dispose with its host.<\/td><\/tr><tr><td><code>RouteChoice<\/code><\/td><td><code>RouteView<\/code> with wave and two <code>RoadView<\/code> signs<\/td><td><code>Chosen(side)<\/code> once, left 0 / right 1. Full signs exceed 44 units; keyboard Enter/Space. <code>Choose<\/code> supports alternate input.<\/td><\/tr><tr><td><code>MerchantScreen<\/code><\/td><td><code>MerchantView<\/code> with credits, offers, sellable stacks and HP consequences<\/td><td><code>Bought(index)<\/code>, <code>PerkSold(id)<\/code>, <code>HealthSold(actor)<\/code>, <code>Left<\/code>. Host validates and rebinds after each transaction. <code>ScrollOffset<\/code> preserves position.<\/td><\/tr><tr><td><code>CreditsChip<\/code><\/td><td><code>Set(credits)<\/code><\/td><td>Currency icon and integer; formats on change.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>PerkTier.Rare<\/code> is cyan; <code>Epic<\/code> is violet with a short shimmer. Both have explicit text labels. Merchant offer states say why a purchase is blocked (credits, sold, stack cap). Health rows state the before/after HP; fighters that cannot retain 1 HP cannot trade. Instant rewards are excluded from sellable stacks by the host. <code>HudTop<\/code> places pause and icon-only autoplay at the top left. Autoplay retains its state tint and tooltip, speed stays on the right, credits sit beside Power. <code>WaveSlammed<\/code> lets the host request its own bounded camera jolt; the GUI has no dependency on a camera or arcade simulation. The host must use actual safe-area insets, with a small battle fallback.<\/p>", "docTitle": "Projection and the road economy", "uss": [{"file": "Gui.uss", "sel": ".vb-credits", "body": "flex-direction: row; align-items: center; flex-shrink: 0; padding: 4px 8px; --vb-cut: 4; --vb-fill: rgba(14,9,20,0.75); --vb-edge: rgba(72,245,239,0.35);"}, {"file": "Gui.uss", "sel": ".vb-credits .vb-icon", "body": "margin-right: 5px; -unity-background-image-tint-color: var(--vb-color-glitch-cyan);"}, {"file": "Gui.uss", "sel": ".vb-credits__value", "body": "font-size: 12px; color: var(--vb-color-glitch-cyan); -unity-font-definition: var(--vb-font-body-medium);"}, {"file": "Gui.uss", "sel": ".vb-hud__resource-row > .vb-credits", "body": "margin-left: 8px;"}], "tokens": ["--vb-color-glitch-cyan", "--vb-font-body-medium"], "api": [{"type": "CreditsChip", "kind": "class", "base": "VisualElement", "file": "Runtime/Composites/RouteMerchant.cs", "summary": "Persistent run currency, formatted only when its value changes.", "members": ["CreditsChip()", "CreditsChip Set(int credits)"]}]}, {"id": "health-bar", "tier": "composite", "name": "HealthBarComposite", "unity": ["HealthBar"], "status": "shipped", "summary": "Health over stability, with barrier, a ghost of recent damage and an optional caption.", "uses": ["meter", "label"], "usedBy": ["boss-bar", "operative-card", "operative-details", "perk-draft"], "blocks": ["vb-health"], "stage": "free", "height": 230, "hasPreview": true, "csharp": "new HealthBar().Into(cell).Set(a.hp, a.maxHp, a.barrier, a.stability / (float)a.maxStability);", "uxml": "", "rules": "", "spec": "", "doc": "<p>Health over stability, with barrier, ghost and caption.<\/p>\n<ul><li><strong>API:<\/strong><\/li><ul><li><code>Set(hp, max, barrier, stability01, exposed, enemy, ghost)<\/code>. <code>ghost<\/code> is health before the last hit; the game lowers it over time.<\/li><li><code>Size(MeterSize.Hud | World | Large)<\/code>.<\/li><li><code>Caption(\"HP 820 / 1000\")<\/code>.<\/li><\/ul><li><strong>States:<\/strong> <code>vb-health--exposed<\/code> (the stability track fills in enemy colour), <code>--enemy<\/code>, <code>--hud<\/code>, <code>--world<\/code>, <code>--large<\/code>.<\/li><li><strong>USS:<\/strong> <code>__label<\/code>, <code>__hp<\/code> (a <code>VbMeter<\/code>), <code>__ghost<\/code>, <code>__stability<\/code>.<\/li><li>< .2f);", "uxml": "", "rules": "", "spec": "", "doc": "<p>Focus drains in real time while targeting slows combat, and regenerates outside it.<\/p>\n<ul><li><strong>API:<\/strong> <code>Set(focus, slow, regenPerSecond, drainPerSecond, slowScale)<\/code>.<\/li><li><strong>States:<\/strong> <code>vb-focus--slow<\/code>.<\/li><li><strong>USS:<\/strong> <code>__label<\/code>, <code>__meter<\/code>, <code>__value<\/code>, <code>__rate<\/code> (<code>×0.2 · −25/s<\/code>, <code>+12.5/s<\/code> or READY).<\/li><\/ul>", "docTitle": "FocusMeter", "uss": [{"file": "Gui.uss", "sel": ".vb-focus", "body": "flex-direction: row; align-items: center; height: 12px; margin-top: 6px;"}, {"file": "Gui.uss", "sel": ".vb-focus__label", "body": "-unity-font-definition: var(--vb-font-body-medium); -unity-font-style: bold; font-size: 10px; letter-spacing: 24.000px; color: var(--vb-color-text-2); width: 56px;"}, {"file": "Gui.uss", "sel": ".vb-focus__meter", "body": "flex-grow: 1; height: 6px; background-color: rgba(250, 238, 244, 0.10);"}, {"file": "Gui.uss", "sel": ".vb-focus__meter .vb-meter__fill", "body": "background-color: var(--vb-color-text-2);"}, {"file": "Gui.uss", "sel": ".vb-focus__value", "body": "-unity-font-definition: var(--vb-font-body-medium); font-size: 11px; width: 26px; -unity-text-align: middle-right;"}, {"file": "Gui.uss", "sel": ".vb-focus__rate", "body": "-unity-font-definition: var(--vb-font-body-medium); -unity-font-style: bold; font-size: 10px; min-width: 60px; -unity-text-align: middle-right; color: var(--vb-color-text-3);"}, {"file": "Gui.uss", "sel": ".vb-focus--slow .vb-focus__meter .vb-meter__fill", "body": "background-color: var(--vb-color-text);"}, {"file": "Gui.uss", "sel": ".vb-focus--slow .vb-focus__rate", "body": "color: var(--vb-color-text);"}], "tokens": ["--vb-color-text", "--vb-color-text-2", "--vb-color-text-3", "--vb-font-body-medium"], "api": [{"type": "FocusMeter", "kind": "class", "base": "VisualElement", "file": "Runtime/Controls/Meters.cs", "summary": "Focus: drains in real time while targeting slows combat, regenerates outside it.", "members": ["const string ClassName=\"vb-focus\"", "FocusMeter()", "FocusMeter Set(float focus,bool slow,float regenPerSecond=12.5f,float drainPerSecond=25,float slowScale=.2f)"]}]}, {"id": "skill-button", "tier": "composite", "name": "SkillButtonComposite", "unity": ["SkillButton", "SkillView", "SkillState"], "status": "shipped", "summary": "The 44 × 56 skill control on an operative card. Every blocked state reads differently.", "uses": ["button", "icon", "meter", "badge"], "usedBy": ["operative-card"], "blocks": ["vb-skill"], "stage": "free", "height": 250, "hasPreview": true, "csharp": "var skill = card.Skill(0);                 // A slot; Skill(1) is S\nskill.AddManipulator(new TargetDrag(BeginAim, MoveAim, Release, CancelAim));", "uxml": "", "rules": "", "spec": "", "doc": "<p>A compact 44 × 56 skill control for portrait cards.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new SkillButton().Bind(view)<\/code>. Attach the game's drag or aim manipulator to it.<\/li><li><strong>View model:<\/strong> <code>SkillView<\/code>: <code>label<\/code>, <code>icon<\/code>, <code>slot<\/code> (A or S), <code>kind<\/code>, <code>cost<\/code>, <code>state<\/code>, <code>charged<\/code>, <code>seconds<\/code>, <code>need<\/code>, <code>queue<\/code>, <code>progress<\/code>, <code>reason<\/code>, <code>description<\/code>, <code>fullDescription<\/code>, <code>cooldownSeconds<\/code>.<\/li><li><strong>States:<\/strong> <code>vb-skill--{state}<\/code>. What each state shows:<\/li><\/ul>\n<p>  | State | Shows |   | --- | --- |   | <code>Ready<\/code> | The cost |   | <code>Aiming<\/code> | AIM, with glow |   | <code>Cooldown<\/code> | A fill rising from the bottom, with the seconds |   | <code>Short<\/code> | NEED <em>n<\/em>, dashed |   | <code>Silenced<\/code> | SIL with the seconds, struck |   | <code>Fallen<\/code> | OUT, with a lock glyph |   | <code>Casting<\/code> | CAST |   | <code>Disabled<\/code> | LOCK |   | <code>Queued<\/code> | QUEUE #<em>n<\/em>, dashed lavender |   | <code>Buffered<\/code> | NEXT with the cost |   | <code>Windup<\/code> | A left-to-right sweep, with the seconds |   | <code>Invalid<\/code> | A struck no-target glyph and the reason |   | <code>Rejected<\/code> | One 400 ms crimson <code>--flash<\/code> |   | <code>Exposed<\/code> | EXPOSED, inverted |<\/p>\n<ul><li><strong>USS:<\/strong> <code>__charge<\/code>, <code>__sweep<\/code>, <code>__slot<\/code>, <code>__icon<\/code>, <code>__slash<\/code>, <code>__foot<\/code>, <code>__top<\/code>, <code>__value<\/code>. While dragged, the element carries <code>vb-dragging<\/code> (from <code>TargetDrag<\/code>).<\/li><li><strong>Access:<\/strong> every blocked state reads differently without colour. The tooltip carries the name, cost and, where it applies, readiness, reason or \"refused\". It is focusable.<\/li><\/ul>", "docTitle": "SkillButton", "uss": [{"file": "Gui.uss", "sel": ".vb-skill", "body": "width: 44px; height: 56px; align-items: center; overflow: hidden; --vb-cut: 6; --vb-fill: var(--vb-color-raised); --vb-edge: var(--vb-color-line-strong);"}, {"file": "Gui.uss", "sel": ".vb-skill__charge", "body": "position: absolute; left: 0; right: 0; bottom: 0; background-color: rgba(29, 217, 160, 0.22); border-top-width: 1px; border-top-color: var(--vb-color-ally-text);"}, {"file": "Gui.uss", "sel": ".vb-skill__slot", "body": "position: absolute; left: 4px; top: 2px; font-size: 10px; color: var(--vb-color-text-3); -unity-font-definition: var(--vb-font-body-medium); -unity-font-style: bold;"}, {"file": "Gui.uss", "sel": ".vb-skill__icon", "body": "width: 20px; height: 20px; margin-top: 13px;"}, {"file": "Gui.uss", "sel": ".vb-skill__slash", "body": "position: absolute; left: 7px; right: 7px; top: 22px; height: 2px; background-color: var(--vb-color-warn); rotate: -35deg;"}, {"file": "Gui.uss", "sel": ".vb-skill__foot", "body": "margin-top: auto; margin-bottom: 3px; align-items: c  "shipped", "summary": "A band of rippling chevrons and a caption along a board edge for a threat about to cross it.", "uses": ["icon", "text"], "usedBy": [], "blocks": ["vb-edge-warning"], "stage": "free", "height": 120, "hasPreview": true, "csharp": "warning.Bind(\"BREACH · 2 HOSTILES\", top: false); warning.Set(urgency, Time.time, reducedMotion);", "uxml": "", "rules": "", "spec": "", "doc": "<ul><li><strong>API:<\/strong> <code>Bind(caption, top)<\/code>, <code>Set(urgency, time, reducedMotion)<\/code>, <code>Urgency<\/code>, <code>Caption<\/code>.<\/li><li><strong>States:<\/strong> <code>vb-edge-warning--top<\/code> (docks to the top edge, chevrons point up), <code>--hot<\/code> (urgency above two thirds).<\/li><li><strong>USS:<\/strong> <code>__row<\/code>, <code>__chevron<\/code> (five chevrons pointing over the edge; they ripple outward unless reduced motion), <code>__caption<\/code>.<\/li><li><strong>Use:<\/strong> a threat about to cross a board edge, such as hostiles inside the breach zone. Urgency 0 hides the band.<\/li><\/ul>", "docTitle": "EdgeWarning", "uss": [{"file": "World.uss", "sel": ".vb-edge-warning", "body": "position: absolute; left: 0; right: 0; bottom: 0; height: 30px; align-items: center; justify-content: center; background-color: rgba(64, 6, 24, 0.42); border-top-width: 2px; border-color: var(--vb-color-enemy);"}, {"file": "World.uss", "sel": ".vb-edge-warning--top", "body": "top: 0; bottom: auto; border-top-width: 0; border-bottom-width: 2px;"}, {"file": "World.uss", "sel": ".vb-edge-warning__row", "body": "flex-direction: row; justify-content: center;"}, {"file": "World.uss", "sel": ".vb-edge-warning__chevron", "body": "margin: 0 6px; rotate: 90deg; -unity-background-image-tint-color: var(--vb-color-enemy-text);"}, {"file": "World.uss", "sel": ".vb-edge-warning--top .vb-edge-warning__chevron", "body": "rotate: -90deg;"}, {"file": "World.uss", "sel": ".vb-edge-warning__caption", "body": "-unity-font-definition: var(--vb-font-body-bold); tom minimums.<\/li><li>Root classes: <code>vb-compact<\/code> (&lt; 380 wide), <code>vb-large-text<\/code>, <code>vb-reduced-motion<\/code>, <code>vb-reduced-flashes<\/code>, <code>vb-contrast<\/code>. Popovers copy them.<\/li><\/ul>", "spec": "", "doc": "<p>The one owner of safe-area insets and root flags.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new SafeAreaRoot(root, panelSettings, overlays…)<\/code>. The constructor also calls <code>FontPrimer.Prime(root)<\/code>. This adds the kit's glyphs to every face's dynamic atlas on the first layout pass, so title tracking never depends on the order a session first shows characters.<\/li><li><strong>API:<\/strong><\/li><ul><li><code>Refresh()<\/code> each frame re-applies only when <code>Screen.safeArea<\/code> or the resolution changed.<\/li><li><code>Apply(area, screen)<\/code> sets explicit insets.<\/li><li><code>Insets<\/code> holds the left, top, right and bottom insets in panel units.<\/li><li><code>UnitsPerPixel(screen)<\/code> covers Scale With Screen Size (any match) and Constant Pixel Size.<\/li><li><code>Flags(largeText, reducedMotion, contrast, reducedFlashes)<\/code>.<\/li><li>Fields <code>MinTop<\/code> (48), <code>MinBottom<\/code> (34), <code>CompactWidth<\/code> (380).<\/li><\/ul><li><strong>Root classes:<\/strong> <code>vb-compact<\/code> (board narrower than <code>CompactWidth<\/code>), <code>vb-large-text<\/code>, <code>vb-reduced-motion<\/code>, <code>vb-reduced-flashes<\/code>, <code>vb-contrast<\/code>.<\/li><\/ul>", "docTitle": "SafeAreaRoot", "uss": [{"file": "Layout.uss", "sel": ".vb-root", "body": "flex-grow: 1;"}], "tokens": [], "api": [{"type": "SafeAreaRoot", "kind": "class", "base": "", "file": "Runtime/Core/SafeAreaRoot.cs", "summary": "The one owner of safe-area insets on a portrait board. It pads the root, insets absolute overlays (screen layers) by the same amounts and keeps the root's responsive and accessibility classes. Call Refresh each frame; it only re-applies when the safe area or resolution changed.", "members": ["const string Compact=\"vb-compact\",LargeText=\"vb-large-text\",ReducedMotion=\"vb-reduced-motion\",ReducedFlashes=\"vb-reduced-flashes\",Contrast=\"vb-contrast\"", "popovers, which live on the panel root, copy them from their anchor.<\/summary> static readonly string[] RootClasses", "/// <summary>Minimum top and bottom insets in panel units (status bar and home indicator room on devices that report none).<\/summary> float MinTop=48,MinBottom=34", "/// <summary>Boards narrower than this many panel units get <see cref=\"Compact\"/>.<\/summary> float CompactWidth=380", "SafeAreaRoot(VisualElement root,PanelSettings panel,params VisualElement[] overlays)", "/// <summary>Left, top, right and bottom insets in panel units, as last applied.<\/summary> Vector4 Insets", "true when it did.<\/summary> bool Refresh()", "/// <summary>Insets for a safe area and screen size in pixels.<\/summary> void Apply(Rect area,Vector2 screen)", "/// <summary>Panel units per screen pixel for the panel's scale mode (match width-or-height, constant pixel or physical size).<\/summary> float UnitsPerPixel(Vector2 screen)", "/// <summary>Sets the responsive and accessibility classes on the root: compact board by width, larger text, reduced motion, high contrast /// and reduced flashes (no glows, flicker, chromatic split or bright flashes).<\/"]}]}, {"id": "screen-layout", "tier": "layout", "name": "ScreenLayout", "unity": ["Navigator", "vb-screen", "vb-page"], "status": "shipped", "summary": "One page at a time on the screen layer: optional header, a scroll body, a footer.", "uses": ["screen-header"], "usedBy": ["main-menu", "squad-view", "settings-view", "perk-draft", "results-view", "scores-view"], "blocks": ["vb-screen", "vb-page"], "stage": "board", "height": 220, "hasPreview": true, "csharp": "var page = nav.Open(\"settings\", back: Leave);   // vb-screen--settings > vb-page--settings\nvar header = new ScreenHeader(\"SETTINGS\", \"SAVED\").Into(page); page.AddToClassList(\"vb-page--headed\");\nvar body = Ui.Scroll(page, \"vb-page__scroll\").contentContainer;", "uxml": "", "rules": "<ul><li>Pages are 16 wide gutters; headed pages span the header and keep a 12 gutter.<\/li><li>Back order: popover → modal → page back → fallback. <code>nav.Blocked<\/code> freezes it.<\/li><\/ul>", "spec": "", "doc": "<p>One page at a time on a screen layer, with modal layers and popovers above it.<\/p>\n<ul><li><strong>Build:<\/strong> <code>new Navigator(screenLayer)<\/code>.<\/li><li><strong>API:<\/strong><\/li><ul><li><code>Open(name, back)<\/code> clears the screen and returns an empty page, <code>vb-page vb-page--{name}<\/code>, on <code>vb-screen vb-screen--{name}<\/code>.<\/li><li><code>Push(onClose)<\/code> adds a modal layer over the page.<\/li><li><code>Close()<\/code>, <code>Back()<\/code>, <code>Page<\/code>, <code>Visible<\/code>, <code>Content<\/code>, <code>Modals<\/code>.<\/li><li>Events <code>Opening(name)<\/code> and <code>Closed<\/code>. Hooks <code>Blocked<\/code> (Back does nothing while true), <code>Fallback<\/code> and <code>PageBack<\/code>.<\/li><\/ul><li><strong>Back order:<\/strong> popover, then modal, then <code>PageBack<\/code>, then <code>Fallback<\/code>. It returns false only when nothing handled it.<\/li><li><strong>USS:<\/strong> <code>vb-screen<\/code> and <code>vb-page<\/code>, plus <code>vb-page--headed<\/code> (under a <code>ScreenHeader<\/code>), <code>vb-page__label<\/code>, <code>__caption<\/code>, <code>__footer<\/code> and <code>__scroll<\/code>, all in <code>Layout.uss<\/code>.<\/li><\/ul>", "docTitle": "Navigator", "uss": [{"file": "Layout.uss", "sel": ".vb-screen", "body": "position: absolute; left: 0; right: 0; top: 0; bottom: 0; background-color: rgba(5, 2, 8, 0.86);"}, {"file": "Views.uss", "sel": ".vb-screen--route, .vb-screen--merchant", "body": "background-color: rgba(5, 2, 8, 0.88);"}, {"file": "Views.uss", "sel": ".vb-screen--menu", "body": "background-color: rgba(5, 2, 8, 0.30);" ost Modals", "hosts cancel drags and cover the HUD here.<\/summary> event Action<string> Opening", "/// <summary>Raised after <see cref=\"Close\"/> hides the screen.<\/summary> event Action Closed", "/// <summary>While true, Back does nothing (an intro or transition owns input).<\/summary> Func<bool> Blocked", "/// <summary>Runs when Back finds no popover, modal or page back action (pause the game, confirm exit).<\/summary> Action Fallback", "set it again when a page changes its own back target.<\/summary> Action PageBack", "string Page", "Navigator(VisualElement screen)", "/// <summary>Whether a page is showing.<\/summary> bool Visible", "an empty page when none was opened (a layer must not sit inside what it disables).<\/summary> VisualElement Content", "<\/c>).<\/summary> VisualElement Open(string name,Action back=null)", "Back pops it first.<\/summary> VisualElement Push(Action onClose=null)", "/// <summary>Hides the screen layer and drops its popovers and modals.<\/summary> void Close()", "false only when nothing handled it.<\/summary> bool Back()"]}]}, {"id": "stack-layout", "tier": "layout", "name": "StackLayout", "unity": ["StackLayout", "Ui.Stack", "vb-stack", "vb-grow"], "status": "shipped", "summary": "Children in a column with one rhythm (4, 8, 12 or 16 under every child but the last); `Ui.Spacer` pushes the rest to the end.", "uses": [], "usedBy": [], "blocks": ["vb-stack", "vb-grow"], "stage": "free", "height": 230, "hasPreview": true, "csharp": "var steps = Ui.Stack(sheet, 8);                 // vb-stack vb-stack--8\nforeach (var s in lines) Ui.Text(steps, s, TypeStyle.Body);\nUi.Spacer(page);                                  // vb-grow: push the CTA to the bottom", "uxml": "<vb:StackLayout gap=\"12\">\n  <vb:CardComponent title=\"Checkpoint\" />\n  <vb:CardComponent title=\"Last run\" />\n<\/vb:StackLayout>", "rules": "<ul><li>Gaps come from the spacing tokens (4, 8, 12, 16). UI Toolkit has no <code>gap<\/code> or <code>:last-child<\/code>: StackLayo tring ClassName=\"vb-board\"", "VisualElement Top", "the camera's gesture surface usually is this element.<\/summary> VisualElement World", "VisualElement Bottom", "BoardLayout()"]}, {"type": "WorldLayer", "kind": "class", "base": "VisualElement", "file": "Runtime/World/WorldLayer.cs", "summary": "The world-space HUD over a 3D view: health bars, combat text, labels, markers and off-screen chips at constant screen size. It knows no camera: Project maps a world point to layer units (null when behind the view). Each frame call BeginFrame, then Bar/Label/Marker/Offscreen for everything that should show, then EndFrame, which removes what was not refreshed and animates combat text. Text is event-driven.", "members": ["const string ClassName=\"vb-world\"", "Func<Vector3,Vector2?> Project", "/// <summary>Pooled combat-text cap, and live numbers per target (a fourth reuses that target's oldest).<\/summary> int TextLimit=40,PerTarget=3", "/// <summary>Same-kind hits on one target merge while they arrive within <see cref=\"MergeSeconds\"/> of each other.<\/summary> float MergeSeconds=.2f,TextSeconds=1.2f,Rise=24,StackStep=14", "/// <summary>Layer units above the projected point for bars, combat text and labels.<\/summary> float BarLift=27,TextLift=40,LabelLift=48", "/// <summary>Gap between an off-screen chip and the board edge.<\/summary> float Edge=10", "/// <summary>Edges off-screen chips stay clear of (left, top, right, bottom), such as a HUD band over the layer.<\/summary> Vector4 Insets", "/// <summary>Combat text fades in place, crits do not pop.<\/summary> bool ReducedMotion", "WorldLayer()", "int Bars", "int Labels", "int Markers", "int Chips", "int LiveTexts", "/// <summary>The layer's size in its own units (zero before layout).<\/summary> Vector2 Size", "void BeginFrame()", "WorldHealthBar Bar(int id,Vector3 world,float health,float barrier=0,WorldTeam team=WorldTeam.Enemy,WorldRank rank=WorldRank.Normal)", "/// <summary>A bar at a point already in layer units, for callers that project themselves.<\/summary> WorldHealthBar BarAt(int id,Vector2 point,float health,float barrier=0,WorldTeam team=WorldTeam.Enemy,WorldRank rank=Wo", "WorldLabel Label(int id,Vector3 world,WorldLabelKind kind,string title,string detail=null,WorldTeam team=WorldTeam.Ally)", "WorldMarker Marker(int id,Vector3 world,WorldMarkerKind kind,float size=0)", "hidden while that point is on the board or behind the view.<\/summary> OffscreenIndicator Offscreen(int id,Vector3 world,string name,WorldTeam team=WorldTeam.Enemy,float metres=-1,bool threat=false)", "/// <summary>A combat number on <paramref name=\"target\"/> at <paramref name=\"world\"/> (it follows that point while it rises).<\/summary> void Text(int target,Vector3 world,int amount,CombatTextKind kind)", "void EndFrame(float delta)", "/// <summary>Where an off-screen point pins to the edge of a board of <paramref name=\"size\"/>: on the line from the board's centre /// to the point, inside <paramref name=\"insets\"/> plus <paramref name=\"edge\"/>. False wh"]}]}, {"id": "world-layer", "tier": "layout", "name": "WorldLayerLayout", "unity": ["WorldLayer"], "status": "shipped", "summary": "The world-space HUD over the 3D view: bars, labels, markers and edge chips, advanced on simulation time.", "uses": ["world-meter", "combat-text", "world-label", "marker", "offscreen"], "usedBy": ["battle-hud-view"], "blocks": ["vb-world"], "stage": "board", "height": 844, "hasPreview": true, "csharp": "layer.BeginFrame();\nforeach (var a in allies) layer.Bar(a.id, a.head, a.hp01, a.barrier01, WorldTeam.Ally);\nlayer.EndFrame(simDelta);", "uxml": "", "rules": "", "spec": "", "doc": "<p>The world-space HUD over the 3D view; see <span class=\"ref\">world space<\/span>.<\/p>\n<ul><li><strong>API:<\/strong><\/li><ul><li>Per frame: <code>BeginFrame()<\/code>; then <code>Bar(id, world, health01, barrier01, team, rank)<\/code>, <code>BarAt(id, point, …)<\/code>, <code>Label(id, world, kind, title, detail, team)<\/code>, <code oard", "height": 844, "hasPreview": true, "csharp": "var market = new MerchantScreenView().Into(nav.Open(\"merchant\"));\nmarket.Bind(view);   // keeps the scroll position across confirmed trades\nmarket.Bought += Buy; market.PerkSold += SellStack; market.HealthSold += SellHp; market.Left += Leave;", "uxml": "", "rules": "<ul><li>The host confirms every trade, then binds again.<\/li><li>MerchantView is the view model; the screen type is MerchantScreenView.<\/li><\/ul>", "spec": "", "doc": "<div class=\"tablewrap\"><table><thead><tr><th>Component<\/th><th>Input<\/th><th>Events / behaviour<\/th><\/tr><\/thead><tbody><tr><td><code>GlitchText<\/code><\/td><td>Ordinary label <code>text<\/code> and USS typography<\/td><td>Eight clipped bands, red/cyan channels. <code>Glitch.In/Out/Pulse/Slam<\/code>; schedules cancel on replacement/detach.<\/td><\/tr><tr><td><code>Announcer<\/code><\/td><td><code>Say(text, alert, milliseconds, interrupt)<\/code><\/td><td>Bounded six-notice queue; critical pre-emption; out before replacement, in then hold then out. Dispose with its host.<\/td><\/tr><tr><td><code>RouteChoice<\/code><\/td><td><code>RouteView<\/code> with wave and two <code>RoadView<\/code> signs<\/td><td><code>Chosen(side)<\/code> once, left 0 / right 1. Full signs exceed 44 units; keyboard Enter/Space. <code>Choose<\/code> supports alternate input.<\/td><\/tr><tr><td><code>MerchantScreen<\/code><\/td><td><code>MerchantView<\/code> with credits, offers, sellable stacks and HP consequences<\/td><td><code>Bought(index)<\/code>, <code>PerkSold(id)<\/code>, <code>HealthSold(actor)<\/code>, <code>Left<\/code>. Host validates and rebinds after each transaction. <code>ScrollOffset<\/code> preserves position.<\/td><\/tr><tr><td><code>CreditsChip<\/code><\/td><td><code>Set(credits)<\/code><\/td><td>Currency icon and integer; formats on change.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>PerkTier.Rare<\/code> is cyan; <code>Epic<\/code> is violet with a short shimmer. Both have explicit text labels. Merchant offer states say why a purchase is blocked (credits, sold, stack cap). Health rows state the before/after HP; fighters that cannot retain 1 HP cannot trade. Instant rewards are excluded from sellable stacks by the host. <code>HudTop<\/code> places pause and icon-only autoplay at the top left. Autoplay retains its state tint and tooltip, speed stays on the right, credits sit beside Power. <code>WaveSlammed<\/code> lets the host request its own bounded camera jolt; the GUI has no dependency on a camera or arcade simulation. The host must use actual safe-area insets, with a small battle fallback.<\/p>", "docTitle": "Projection and the road economy", "uss": [{"file": "Views.uss", "sel": ".vb-route-view, .vb-merchant-view", "body": "padding-top: 8px;"}, {"file": "Views.uss", "sel": ".vb-merchant-view > .vb-merchant", "body": "flex-grow: 1;"}, {"file": "Gui.uss", "sel": ".vb-merchant", "body": "flex-grow: 1; min-height: 0;"}, {"file": "Gui.uss", "sel": ".vb-merchant__head", "body": "flex-direction: row; align-items: center; justify-content: space-between; padding: 12px 0; flex-shrink: 0;"}, {"file": "Gui.uss", "sel": ".vb-merchant__title", "body": "font-size: 26px;"}, {"file": "Gui.uss", "sel": ".vb-merchant__scroll", "body": "flex-grow: 1; min-height: 0;"}, {"file": "Gui.uss", "sel": ".vb-merchant__section", "body": "margin-top: 18px; margin-bottom: 8px; color: var(--vb-color-glitch-cyan);"}, {"file": "Gui.uss", "sel": ".vb-merchant__offers", "body": "flex-direction: row; align-items: stretch;"}, {"file": "Gui.uss", "sel": ".vb-merchant__offer", "body": "flex-grow: 1; flex-basis: 0; min-width: 0; margin: 0 3px;"}, {"file": "Gui.uss", "sel": ".vb-merchant__buy", "body": "min-height: 48px; margin-top: 5px; padding: 6px 4px; font-size: 11px;"}, {"file": "Gui.uss", "sel": ".vb-merchant__buy .vb-button__sub", "body": "font-size: 9px; white-space: normal;"}, {"file": "Gui.uss", "sel": ".vb-merchant__exchange", "body": "flex-direction: row; align-ite
