<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ItemCell — Veilbreak</title></head>
<body class="vb vb-stage">
<div id="root"></div>
<script>
var V = window.Veilbreak, h = React.createElement, F = React.Fragment;
function cell(node, cap, style) { return h('div', { className: 'vb-col', style: Object.assign({ alignItems: 'flex-start' }, style || {}) }, node, cap ? h('div', { className: 'vb-cap' }, cap) : null); }
function row(kids, style) { return h('div', { className: 'vb-row', style: Object.assign({ alignItems: 'flex-start', gap: 20 }, style || {}) }, kids); }
var I = V.ItemCell;
ReactDOM.createRoot(document.getElementById('root')).render(row([
  cell(h(I, { slot: 'optic', rarity: 'normal', showSlot: true }), 'normal'),
  cell(h(I, { slot: 'core', rarity: 'magic', showSlot: true }), 'magic'),
  cell(h(I, { slot: 'plating', rarity: 'rare', upgrade: 4, showSlot: true }), 'rare +4'),
  cell(h(I, { slot: 'weapon', rarity: 'set', showSlot: true }), 'set'),
  cell(h(I, { slot: 'charm', rarity: 'unique', upgrade: 10, showSlot: true }), 'unique +10'),
  cell(h(I, { slot: 'core', rarity: 'rare', state: 'selected', showSlot: true }), 'selected'),
  cell(h(I, { slot: 'charm', state: 'empty', showSlot: true }), 'empty'),
  cell(h(I, { slot: 'weapon', rarity: 'magic', state: 'locked', showSlot: true }), 'locked')
], { gap: 18 }));
</script>
</body>
</html>
