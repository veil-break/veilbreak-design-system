<html lang="en">
<head><meta charset="utf-8"><title>Minimap — Veilbreak</title></head>
<body class="vb vb-stage">
<div id="root"></div>

var V = window.Veilbreak, h = React.createElement, F = React.Fragment;
function cell(node, cap, style) { return h('div', { className: 'vb-col', style: Object.assign({ alignItems: 'flex-start' }, style || {}) }, node, cap ? h('div', { className: 'vb-cap' }, cap) : null); }
function row(kids, style) { return h('div', { className: 'vb-row', style: Object.assign({ alignItems: 'flex-start', gap: 20 }, style || {}) }, kids); }
var props = [[18,29.5,4,3,'anchor'],[10,24,5,2],[25,36,5,2,'cracked'],[25,22,2,5],[13,35,2,5,'broken'],[6,30,3,2],[31,30,3,2],

  .map(function (a) { return { x: a[0], y: a[1], w: a[2], h: a[3], state: a[4] || 'intact' }; });
var fighters = [{ x: 16, y: 40, team: 'ally' }, { x: 19.5, y: 42.5, team: 'ally', selected: true }, { x: 23, y: 40.5, team: 'ally' }, { x: 15, y: 46, team: 'ally' },

  cell(h(V.Minimap, { props: props, fighters: fighters, view: [8, 18, 24, 30] }), 'camera view · props by state'),
  cell(h(V.Minimap, { props: props, fighters: fighters, safe: [12, 19, 16, 24], caption: 'Pressure' }), 'pressure · final safe region')
], { gap: 32 }));
</script>
</body>
</html>
